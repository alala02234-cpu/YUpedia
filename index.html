const RTC_CFG={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const encCode=d=>btoa(unescape(encodeURIComponent(JSON.stringify({t:d.type,s:d.sdp}))));
const decCode=c=>{const o=JSON.parse(decodeURIComponent(escape(atob(String(c).replace(/\s+/g,'')))));return {type:o.t,sdp:o.s}};
const waitIce=pc=>new Promise(res=>{
  if(pc.iceGatheringState==='complete')return res();
  const f=()=>{if(pc.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);res()}};
  pc.addEventListener('icegatheringstatechange',f);setTimeout(res,6000);
});
async function openP2PSend(ids,light){
  if(!window.RTCPeerConnection){toast('この端末・ブラウザでは直接送受信を使えません');return}
  let json;try{json=buildExport(ids,light).json}catch{toast('データを作れませんでした');return}
  const box=document.createElement('div');box.className='modal-box wide';
  box.innerHTML=`<button type="button" class="modal-x icon-btn" aria-label="閉じる">${ic('x')}</button><h3>直接送る（送る側）</h3>
  <p class="hint" style="margin:0 0 8px">① 下の「送るコード」をコピーして、受け取る側の端末に送ります（LINE・メールなど）。② 受け取る側で作られた「返信コード」を貼り付けて、「接続して送る」を押します。</p>
  <div class="lbl">① 送るコード</div><textarea id="p2pOut" class="m-input" rows="4" readonly placeholder="コードを作っています…"></textarea>
  <div class="row" style="margin:6px 0 10px"><button type="button" class="btn" id="p2pCopy">コードをコピー</button></div>
  <div class="lbl">② 返信コード</div><textarea id="p2pIn" class="m-input" rows="3" placeholder="受け取る側の返信コードを貼り付け"></textarea>
  <div class="row" style="margin-top:8px"><button type="button" class="btn primary" id="p2pGo">接続して送る</button></div><div id="p2pSt" class="hint" style="margin:10px 0 0"></div>`;
  let pc=null;
  openModal(box,()=>{try{pc&&pc.close()}catch{}});
  const st=t=>{const e=$('#p2pSt',box);if(e)e.textContent=t};
  pc=new RTCPeerConnection(RTC_CFG);
  const dc=pc.createDataChannel('yu');
  dc.onopen=async()=>{
    st('接続しました。送信中…');
    try{
      const bytes=new TextEncoder().encode(json),N=16000,n=Math.ceil(bytes.length/N);
      dc.send(JSON.stringify({m:'meta',n,size:bytes.length}));
      for(let i=0;i<n;i++){
        while(dc.bufferedAmount>1000000)await new Promise(r=>setTimeout(r,40));
        dc.send(bytes.slice(i*N,(i+1)*N));
        if(i%20===0)st('送信中… '+Math.round((i+1)/n*100)+'%');
      }
      dc.send(JSON.stringify({m:'end'}));
      st('送信しました（'+Math.round(bytes.length/1024)+'KB）。受け取る側にインポートの確認が表示されます。');
    }catch{st('送信に失敗しました')}
  };
  pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')st('接続できませんでした。2台を同じWi-Fiにつなぐと成功しやすくなります。')};
  try{const off=await pc.createOffer();await pc.setLocalDescription(off);await waitIce(pc);$('#p2pOut',box).value=encCode(pc.localDescription)}
  catch{st('コードを作れませんでした');return}
  $('#p2pCopy',box).onclick=async()=>{toast(await copyText($('#p2pOut',box).value)?'コピーしました':'コピーできませんでした')};
  $('#p2pGo',box).onclick=async()=>{try{await pc.setRemoteDescription(decCode($('#p2pIn',box).value));st('接続中…')}catch{st('返信コードが正しくありません')}};
}
function openP2PReceive(){
  if(!window.RTCPeerConnection){toast('この端末・ブラウザでは直接送受信を使えません');return}
  const box=document.createElement('div');box.className='modal-box wide';
  box.innerHTML=`<button type="button" class="modal-x icon-btn" aria-label="閉じる">${ic('x')}</button><h3>直接受け取る（受け取る側）</h3>
  <p class="hint" style="margin:0 0 8px">① 送る側の「送るコード」を貼り付けて、「返信コードを作る」を押します。② できた「返信コード」をコピーして、送る側に送り返します。③ 送る側が「接続して送る」を押すと、データが自動で届きます。</p>
  <div class="lbl">① 送るコード</div><textarea id="p2pIn" class="m-input" rows="3" placeholder="送る側のコードを貼り付け"></textarea>
  <div class="row" style="margin-top:8px"><button type="button" class="btn primary" id="p2pMk">返信コードを作る</button></div>
  <div class="lbl" style="margin-top:12px">② 返信コード</div><textarea id="p2pOut" class="m-input" rows="4" readonly></textarea>
  <div class="row" style="margin-top:6px"><button type="button" class="btn" id="p2pCopy">コードをコピー</button></div><div id="p2pSt" class="hint" style="margin:10px 0 0"></div>`;
  let pc=null,chunks=[];
  const close=openModal(box,()=>{try{pc&&pc.close()}catch{}});
  const st=t=>{const e=$('#p2pSt',box);if(e)e.textContent=t};
  $('#p2pMk',box).onclick=async()=>{
    try{
      pc=new RTCPeerConnection(RTC_CFG);
      pc.ondatachannel=ev=>{
        const ch=ev.channel;ch.binaryType='arraybuffer';
        ch.onopen=()=>st('接続しました。受信中…');
        ch.onmessage=m=>{
          if(typeof m.data==='string'){
            const o=JSON.parse(m.data);
            if(o.m==='meta')chunks=[];
            else if(o.m==='end'){
              const total=chunks.reduce((a,c)=>a+c.length,0),all=new Uint8Array(total);let off=0;
              chunks.forEach(c=>{all.set(c,off);off+=c.length});
              const text=new TextDecoder().decode(all);
              close();runImport(text);
            }
          }else{chunks.push(new Uint8Array(m.data));if(chunks.length%20===0)st('受信中… '+chunks.length+'ブロック')}
        };
      };
      pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed')st('接続できませんでした。2台を同じWi-Fiにつなぐと成功しやすくなります。')};
      await pc.setRemoteDescription(decCode($('#p2pIn',box).value));
      const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await waitIce(pc);
      $('#p2pOut',box).value=encCode(pc.localDescription);
      st('返信コードをコピーして、送る側に送り返してください。');
    }catch{st('送るコードが正しくありません')}
  };
  $('#p2pCopy',box).onclick=async()=>{toast(await copyText($('#p2pOut',box).value)?'コピーしました':'コピーできませんでした')};
}
const normTags=t=>Array.isArray(t)?t.filter(x=>typeof x==='string'&&x).map(String):[];
const normSecs=(secs,needSrc)=>(Array.isArray(secs)?secs:[]).map(s=>({
  sid:(s&&s.sid)||uid(),heading:String((s&&s.heading)||''),html:String((s&&s.html)||''),
  media:(Array.isArray(s&&s.media)?s.media:[]).filter(m=>m&&(m.type==='image'||m.type==='audio'||m.type==='video')&&(!needSrc||typeof m.src==='string')).map(m=>{
    const o={mid:m.mid||uid(),type:m.type,name:String(m.name||''),caption:typeof m.caption==='string'?m.caption:null};
    if(typeof m.src==='string')o.src=m.src;return o})
}));
function normArticle(a){
  if(!a||typeof a!=='object'||!a.id||typeof a.title!=='string')return null;
  return {id:String(a.id),title:a.title,tags:normTags(a.tags),created:a.created||Date.now(),updated:a.updated||Date.now(),
    sections:normSecs(a.sections,true),
    versions:(Array.isArray(a.versions)?a.versions:[]).filter(v=>v&&Array.isArray(v.sections)).slice(-5).map(v=>({t:v.t||Date.now(),title:String(v.title||a.title),tags:normTags(v.tags),sections:normSecs(v.sections,false)}))};
}
function parseImport(text){
  const d=JSON.parse(text);
  if(!d||!Array.isArray(d.articles))throw new Error('bad format');
  const seen=new Set(),articles=[];
  d.articles.map(normArticle).filter(Boolean).forEach(a=>{if(!seen.has(a.id)){seen.add(a.id);articles.push(a)}});
  if(d.scope==='articles')return {scope:'articles',articles};
  const as={};
  ['bg','logo','icon'].forEach(k=>{const v=d.assets&&d.assets[k];if(typeof v==='string'&&/^data:image\//.test(v))as[k]=v});
  return {
    articles,
    bookmarks:(Array.isArray(d.bookmarks)?d.bookmarks:[]).filter(b=>b&&b.id&&(seen.has(String(b.id))||String(b.id)==='guide')).map(b=>({id:String(b.id),t:b.t||Date.now()})),
    history:(Array.isArray(d.history)?d.history:[]).filter(h=>h&&h.w&&h.d).map(h=>({i:h.i||uid(),w:String(h.w),d:String(h.d),t:h.t||Date.now(),hd:!!h.hd})),
    opened:(d.opened&&typeof d.opened==='object')?d.opened:{},
    settings:(d.settings&&typeof d.settings==='object')?d.settings:{},
    assets:as
  };
}
function pickImport(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,.txt,.gz,application/json,application/gzip,text/plain';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    let t;try{t=await readImportText(f)}catch{toast('ファイルを読み込めませんでした');return}
    runImport(t);
  };
  inp.click();
}
async function runImport(text){
  {
    let data;
    try{data=parseImport(text)}catch{toast('読み込めないデータです（YUpediaでエクスポートしたデータを選んでください）');return}
    if(data.scope==='articles'){
      /* 「記事をエクスポート」したファイル：その記事だけを追加する（ほかのデータは消えない） */
      if(!data.articles.length){toast('ファイルに記事がありません');return}
      const okA=await confirmDialog({title:'記事をインポートしますか？',message:data.articles.length+'件の記事を追加します。同じ記事（同じID）がある場合は上書きされます。ほかのデータは消えません。',okText:'インポートする',cancelText:'キャンセル'});
      if(okA!==true)return;
      let n=0;
      for(const a of data.articles){
        let t=a.title,k=1;
        while(state.articles.some(x=>x.id!==a.id&&x.title===t)){k++;t=a.title+'（'+k+'）'}
        a.title=t;
        try{await DB.put(a)}catch{toast('インポートに失敗しました（容量不足の可能性があります）');return}
        const i=state.articles.findIndex(x=>x.id===a.id);
        if(i>=0)state.articles[i]=a;else state.articles.push(a);
        n++;
      }
      renderSettings();toast('記事を'+n+'件インポートしました');return;
    }
    const ok=await confirmDialog({title:'警告',message:'このページをエクスポートしていない場合データがすべて消えますがよろしいですか',okText:'する',cancelText:'しない',danger:true,warn:true,okFirst:true});
    if(ok!==true)return;
    try{await DB.replaceAll(data.articles);await DB.clearDrafts();await DB.replaceAssets(data.assets)}catch{toast('インポートに失敗しました');return}
    state.articles=data.articles;state.trash=[];
    bms=data.bookmarks;hist=data.history;opened=data.opened;
    assets=Object.assign({bg:null,logo:null,icon:null},data.assets);
    settings=Object.assign({},DEFAULT_SETTINGS,data.settings);

/* ================= エディタ（作成・編集） ================= */
let ed=null;
const newSection=()=>({sid:uid(),heading:'',html:'',media:[]});
const clone=a=>({id:a.id,title:a.title,tags:[...(a.tags||[])],sections:a.sections.map(s=>({sid:s.sid,heading:s.heading,html:s.html,media:s.media.map(m=>({...m}))}))});
const sig=a=>JSON.stringify([a.title,a.tags||[],a.sections.map(s=>[s.sid,s.heading,s.html,s.media.map(m=>[m.mid,m.caption])])]);
const draftKey=()=>ed.isNew?'new':ed.a.id;

function renderNew(t){
  t=t||'';
  startEditor({id:null,title:t,tags:[],sections:[]},true);
  setTitle('ページ作成 -YUpedia');
}
function renderEdit(id){const a=getArticle(id);if(!a)return renderNotFound();startEditor(a,false);setTitle(a.title+'を編集 -YUpedia')}
function startEditor(a,isNew){
  ed={isNew,a:clone(a),stack:[],idx:0,timer:null,lastRange:null,placing:null,saved:false,leaving:false};
  ed.a.sections.forEach(s=>{
    s.html=sanitize(s.html);
    s.media.forEach(m=>{m.caption=(typeof m.caption==='string')?sanitize(m.caption):null});
  });
  document.body.classList.add('editing');$('#subbar').hidden=false;
  renderEditor();
  /* 画面に反映された状態を基準にする（見かけ上の差で「未保存」と誤判定しないため） */
  syncFromDOM();
  ed.stack=[{a:clone(ed.a),s:sig(ed.a)}];ed.idx=0;ed.initSig=ed.stack[0].s;
  updateUndoBtns();

}
function isDirty(){if(!ed||ed.saved||ed.leaving)return false;syncFromDOM();return sig(ed.a)!==ed.initSig}

/* 画像・音声・映像の1件分（説明の入力欄は最初から表示。ドラッグで移動できる） */
function mediaHTML(m){
  const cap=`<div class="cap-rich" contenteditable="true" spellcheck="false" data-mid="${m.mid}" data-ph="説明を入力"></div>`;
  if(m.type==='image')return `<figure class="media img" draggable="true" data-mid="${m.mid}" style="margin:0"><div class="img-wrap"><img src="${esc(m.src)}" alt="" draggable="false"><button type="button" class="m-del" data-act="m-del" title="削除">${ic('x',14)}</button></div>${cap}</figure>`;
  if(m.type==='video')return `<div class="media vid" draggable="true" data-mid="${m.mid}"><button type="button" class="m-del" data-act="m-del" title="削除">${ic('x',14)}</button><div class="fname">${esc(m.name)}</div><video controls src="${esc(m.src)}" draggable="false"></video>${cap}</div>`;
  return `<div class="media aud" draggable="true" data-mid="${m.mid}"><button type="button" class="m-del" data-act="m-del" title="削除">${ic('x',14)}</button><div class="fname">${esc(m.name)}</div><audio controls src="${esc(m.src)}" draggable="false"></audio>${cap}</div>`;
}
const mediaColHTML=s=>s.media.map(mediaHTML).join('')||'<div class="media-empty">画像・映像・音声</div>';
const secHTML=(s,i)=>`<div class="card section" data-i="${i}"><div class="sec-top"><span class="sec-no">目次セクション ${i+1}</span><button class="sec-del" data-act="sec-del" title="このセクションを削除">${ic('trash',18)}</button></div><div class="sec-grid"><div class="sec-left"><label class="lbl">目次を入力</label><input class="sec-heading" type="text" autocomplete="off"><label class="lbl">テキストを入力</label><div class="rich" contenteditable="true" spellcheck="false"></div></div><div class="sec-right">${mediaColHTML(s)}</div></div></div>`;
const addBtnHTML=pos=>`<button type="button" class="add-sec" data-act="add-sec" data-pos="${pos}">${ic('plus',20)} 目次を追加</button>`;
function secsHTML(a){
  let h=addBtnHTML(0);
  a.sections.forEach((s,i)=>{h+=secHTML(s,i)+addBtnHTML(i+1)});
  return h;
}
function fillSection(el,s){
  $('.sec-heading',el).value=s.heading;
  $('.rich',el).innerHTML=s.html;
  fillCaps(el,s);
}
function fillCaps(root,s){
  $$('.cap-rich',root).forEach(inp=>{const m=s.media.find(m=>m.mid===inp.dataset.mid);inp.innerHTML=sanitize((m&&m.caption)||'')});
}
/* セクション削除後、「目次を追加」ボタンが2つ連続で並ばないようにする */
function dedupeAddBtns(){
  const container=$('#secs');if(!container)return;
  const children=[...container.children];
  for(let i=children.length-1;i>0;i--){
    if(children[i].classList.contains('add-sec')&&children[i-1].classList.contains('add-sec')){
      children[i].remove();
    }
  }
}
/* セクションと「目次を追加」ボタンの番号・位置を振り直す */
function renumberSecs(){
  const container=$('#secs');if(!container)return;
  let n=0;
  [...container.children].forEach(ch=>{
    if(ch.classList.contains('add-sec')){ch.dataset.pos=n}
    else if(ch.classList.contains('section')){ch.dataset.i=n;const no=$('.sec-no',ch);if(no)no.textContent='目次セクション '+(n+1);n++}
  });
}

function renderEditor(){
  const y=window.scrollY,a=ed.a;
  $('#view').innerHTML=`<div class="page" id="editor"><div class="page-head"><h1 class="h1">${ed.isNew?'ページを作成':'ページを編集'}</h1></div><div class="field-label">見出し</div><div class="card"><input id="titleInput" class="title-input" type="text" autocomplete="off"></div><div id="secs">${secsHTML(a)}</div></div>`;
  $('#titleInput').value=a.title;
  $$('.section').forEach((el,i)=>fillSection(el,a.sections[i]));
  window.scrollTo(0,y);ed.lastRange=null;
  drawSlots();updatePlaceBanner();updateUndoBtns();
}
function syncFromDOM(){
  if(!ed||!$('#editor'))return;
  ed.a.title=$('#titleInput').value;
  $$('#editor .section').forEach((el,i)=>{
    const s=ed.a.sections[i];if(!s)return;
    s.heading=$('.sec-heading',el).value;
    s.html=$('.rich',el).innerHTML;
    $$('.cap-rich',el).forEach(inp=>{const m=s.media.find(m=>m.mid===inp.dataset.mid);if(m)m.caption=inp.innerHTML});
  });
}

/* 「ここに設置」ボタンを画面全体を作り直さずに出し入れする（再生中の音声・映像を止めないため） */
function drawSlots(){
  if(!$('#editor'))return;
  $$('#editor .slot').forEach(x=>x.remove());
  $$('#editor .section').forEach((sec,i)=>{
    const right=$('.sec-right',sec);
    const items=[...right.children].filter(c=>c.classList.contains('media'));
    const em=$('.media-empty',right);
    if(ed&&ed.placing){
      if(em)em.remove();
      const mk=j=>{const b=document.createElement('button');b.type='button';b.className='slot';b.dataset.act='slot';b.dataset.sec=i;b.dataset.pos=j;b.textContent='ここに設置';return b};
      items.forEach((it,j)=>right.insertBefore(mk(j),it));
      right.appendChild(mk(items.length));
    }else if(!items.length&&!em){
      const d=document.createElement('div');d.className='media-empty';d.textContent='画像・映像・音声';right.appendChild(d);
    }
  });
}
/* 目次の追加：クリックした位置に挿入し、DOMに追加するだけなので、再生中の音声・映像は止まらない */
function addSectionAt(pos){
  if(!ed)return;
  commit();
  const s=newSection();
  ed.a.sections.splice(pos,0,s);
  const btns=[...$$('#secs > [data-act="add-sec"]')];
  const clickedBtn=btns[pos];if(!clickedBtn){renderEditor();commit();return}
  const secWrap=document.createElement('div');secWrap.innerHTML=secHTML(s,pos);
  const secEl=secWrap.firstElementChild;
  const btnWrap=document.createElement('div');btnWrap.innerHTML=addBtnHTML(pos+1);
  const newBtn=btnWrap.firstElementChild;
  clickedBtn.after(secEl);
  secEl.after(newBtn);
  fillSection(secEl,s);
  renumberSecs();
  drawSlots();
  commit();
}
/* セクション削除：ページ作成時のみ確認を挟む */
async function handleSecDel(el){
  if(!ed)return;
  const sec=el.closest('.section');if(!sec)return;
  const i=+sec.dataset.i;
  const doDel=()=>{commit();ed.a.sections.splice(i,1);sec.remove();dedupeAddBtns();renumberSecs();drawSlots();commit()};
  if(ed.isNew){
    const ok=await confirmDialog({title:'目次を削除しますか？',message:'このセクションの内容が失われます。',okText:'削除する',danger:true});
    if(ok===true)doDel();
  }else doDel();
}

/* ---- 元に戻す / やり直す ---- */
function commit(){
  if(!ed)return;
  clearTimeout(ed.timer);syncFromDOM();
  const s=sig(ed.a);
  if(s!==ed.stack[ed.idx].s){
    ed.stack=ed.stack.slice(0,ed.idx+1);ed.stack.push({a:clone(ed.a),s});
    if(ed.stack.length>200)ed.stack.shift();
    ed.idx=ed.stack.length-1;
  }
  updateUndoBtns();
}
const commitSoon=()=>{if(!ed)return;clearTimeout(ed.timer);ed.timer=setTimeout(commit,600)};
function loadState(){ed.a=clone(ed.stack[ed.idx].a);ed.placing=null;renderEditor()}
function undo(){if(!ed)return;commit();if(ed.idx>0){ed.idx--;loadState()}}
function redo(){if(!ed)return;commit();if(ed.idx<ed.stack.length-1){ed.idx++;loadState()}}
function updateUndoBtns(){
  const u=$('[data-act="tb-undo"]'),r=$('[data-act="tb-redo"]');if(!u||!r)return;
  u.disabled=!ed||ed.idx===0;r.disabled=!ed||ed.idx>=ed.stack.length-1;
}

/* ---- 一時保存（Ctrl+S／30秒ごとの自動保存）と復元 ---- */
async function saveDraft(silent){
  if(!ed)return;
  commit();
  try{
    await DB.putDraft({key:draftKey(),t:Date.now(),a:clone(ed.a)});
    if(!silent)toast('一時保存しました（確定するには「保存する」を押してください）');
  }catch{if(!silent)toast('一時保存に失敗しました')}
}
async function checkDraft(){
  const my=ed;if(!my)return;
  const key=draftKey();
  let d;try{d=await DB.getDraft(key)}catch{return}
  if(!d||ed!==my)return;
  const ok=await confirmDialog({title:'一時保存の内容があります',message:fmtDT(d.t)+' に一時保存された内容があります。復元しますか？',okText:'復元する',cancelText:'破棄する',okFirst:true});
  if(ed!==my)return;
  if(ok===true){
    ed.a=clone(d.a);ed.a.id=my.isNew?null:my.a.id;
    ed.a.sections.forEach(s=>{s.html=sanitize(s.html);s.media.forEach(m=>{m.caption=(typeof m.caption==='string')?sanitize(m.caption):null})});
    ed.placing=null;renderEditor();commit();toast('一時保存の内容を復元しました');
  }else if(ok===false){
    try{await DB.delDraft(key)}catch{}
  }
}

/* ---- 保存 ---- */
async function saveEditor(){
  if(!ed)return;
  commit();const a=ed.a;const title=a.title.trim();
  if(!title){toast('見出しを入力してください');$('#titleInput').focus();return}
  if(state.articles.some(x=>x.id!==a.id&&x.title===title)){toast('同じ見出しの記事がすでにあります');return}
  const key=draftKey();
  const id=a.id||uid();const old=getArticle(id);
  const rec={id,title,tags:[...(a.tags||[])],created:old?old.created:Date.now(),updated:Date.now(),
    sections:a.sections.map(s=>({sid:s.sid,heading:s.heading,html:sanitize(s.html),
      media:s.media.map(m=>({...m,caption:(typeof m.caption==='string')?sanitize(m.caption):null}))}))};
  rec.versions=buildVersions(old,rec);
  try{await DB.put(rec)}catch{toast('保存に失敗しました（容量不足の可能性があります）');return}
  try{await DB.delDraft(key)}catch{}
  const i=state.articles.findIndex(x=>x.id===id);
  if(i>=0)state.articles[i]=rec;else state.articles.push(rec);
  ed.saved=true;toast('保存しました');
  navigate('#/article/'+id,true);
}
/* キャンセルボタン：常に確認してから編集を終了する */
async function cancelEditor(){

  else navigate(ed.isNew?'#/':'#/article/'+ed.a.id,true);
}

/* ---- 画像・映像・音声 ---- */
function pickFile(type){
  if(!ed.a.sections.length){toast('先に「目次を追加」を押してセクションを作ってください');return}
  const inp=document.createElement('input');inp.type='file';
  inp.accept=type==='image'?'image/*':type==='video'?'video/*':'audio/*';
  const maxSize=type==='video'?200*1024*1024:50*1024*1024;
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    if(f.size>maxSize){toast('ファイルが大きすぎます（'+(maxSize/1024/1024)+'MBまで）');return}
    const fr=new FileReader();
    fr.onload=()=>{
      commit();
      ed.placing={item:{mid:uid(),type,name:f.name,src:fr.result,caption:''}};
      drawSlots();updatePlaceBanner();toast('設置したい場所の「ここに設置」を押してください');
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}
function placeMedia(si,pos){
  if(!ed||!ed.placing)return;
  commit();
  const item=ed.placing.item;
  ed.a.sections[si].media.splice(pos,0,item);
  ed.placing=null;
  const right=$('.sec-right',$$('#editor .section')[si]);
  const slotEl=$(`.slot[data-pos="${pos}"]`,right);
  const t=document.createElement('div');t.innerHTML=mediaHTML(item);
  right.insertBefore(t.firstElementChild,slotEl);
  drawSlots();updatePlaceBanner();commit();
}
/* 画像・映像・音声をドラッグして移動・挿入する */
function moveMedia(si,mid,targetSi,targetMid,before){
  if(!ed)return;
  commit();
  const srcSec=ed.a.sections[si];if(!srcSec)return;
  const idx=srcSec.media.findIndex(m=>m.mid===mid);if(idx<0)return;
  const dstSec=ed.a.sections[targetSi];if(!dstSec)return;
  const[item]=srcSec.media.splice(idx,1);
  let pos=dstSec.media.length;
  if(targetMid){
    const ti=dstSec.media.findIndex(m=>m.mid===targetMid);
    if(ti>=0)pos=before?ti:ti+1;
  }
  dstSec.media.splice(pos,0,item);
  renderEditor();
  commit();
}
function updatePlaceBanner(){
  const b=$('#placeBanner');
  if(ed&&ed.placing){const tn=ed.placing.item.type==='image'?'画像':ed.placing.item.type==='video'?'映像':'音声';b.hidden=false;b.innerHTML=`${tn}を置く場所の「ここに設置」を押してください <button class="btn" id="placeCancel">キャンセル</button>`}
  else b.hidden=true;
}
$('#placeBanner').addEventListener('click',e=>{if(e.target.closest('#placeCancel')&&ed){ed.placing=null;drawSlots();updatePlaceBanner()}});

/* ---- 本文・説明文内の位置（キャレット）管理 ---- */
document.addEventListener('selectionchange',()=>{
  if(!ed)return;
  const s=getSelection();if(!s.rangeCount)return;
  const r=s.getRangeAt(0),n=r.commonAncestorContainer,el=n.nodeType===1?n:n.parentElement;
  if(el&&el.closest&&el.closest('#editor .rich,#editor .cap-rich')){
    ed.lastRange=r.cloneRange();
    const sc=el.closest('.section');if(sc)ed.lastSec=+sc.dataset.i;
    updateTextState();
  }
});
function getRange(){
  const r=ed&&ed.lastRange;if(!r)return null;
  if(!document.body.contains(r.startContainer))return null;
  return r;
}
const richOf=r=>(r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement).closest('.rich,.cap-rich');

/* ---- URL挿入 ---- */
function normUrl(s){
  s=(s||'').trim();if(!s)return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(s))s='https://'+s;
  try{const u=new URL(s);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}
}
function openUrlModal(){
  if(!getRange()){toast('先に、リンクを入れたい本文（または説明文）中の位置をクリックしてください');return}
  syncFromDOM();
  const heads=[...new Set(ed.a.sections.map(x=>(x.heading||'').trim()).filter(Boolean))];
  const box=document.createElement('div');box.className='modal-box square';
  box.innerHTML=`<button class="modal-x icon-btn" aria-label="閉じる">${ic('x')}</button><div><input id="uWiki" class="m-input" placeholder="YUpedia内を検索" autocomplete="off"><div id="uRes" class="u-res"></div><div class="lbl">この記事の目次</div><div id="uToc" class="u-res">${heads.length?heads.map(h=>`<button class="u-item" data-toc="${esc(h)}">${esc(h)}</button>`).join(''):'<div class="u-none">目次がまだありません</div>'}</div></div><div class="row"><input id="uUrl" class="m-input" placeholder="URLを入力" autocomplete="off"><button class="btn primary" id="uGo">挿入</button></div>`;
  const close=openModal(box);
  const res=$('#uRes',box),q=$('#uWiki',box);
  const draw=()=>{
    const k=q.value.trim().toLowerCase();
    const list=sortedArticles().filter(a=>a.id!==ed.a.id&&(!k||a.title.toLowerCase().includes(k))).slice(0,6);
    res.innerHTML=list.length?list.map(a=>`<button class="u-item" data-id="${a.id}">${esc(a.title)}</button>`).join(''):'<div class="u-none">該当する記事がありません</div>';
  };
  draw();q.addEventListener('input',draw);
  res.addEventListener('click',e=>{const b=e.target.closest('.u-item');if(!b)return;const a=getArticle(b.dataset.id);close();insertLink('#/article/'+a.id,a.title,a.id)});
  $('#uToc',box).addEventListener('click',e=>{const b=e.target.closest('.u-item');if(!b)return;const h=b.dataset.toc;close();insertLink('#',h,null,h)});
  const go=()=>{const u=normUrl($('#uUrl',box).value);if(!u){toast('正しいURLを入力してください（http / https）');return}close();insertLink(u,u,null)};
  $('#uGo',box).addEventListener('click',go);
  $('#uUrl',box).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();go()}});
  q.focus();
}
function insertLink(href,label,wikiId,tocTitle){
  const r=getRange();if(!r){toast('挿入位置が見つかりません');return}
  const rich=richOf(r);if(!rich){toast('挿入位置が見つかりません');return}
  rich.focus();
  const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  const a=document.createElement('a');a.href=href;
  if(tocTitle){a.dataset.toc=tocTitle;a.textContent=(!r.collapsed&&r.toString())||label}
  else if(wikiId){a.dataset.wiki=wikiId;a.dataset.hist=label;a.textContent=label}
  else{a.target='_blank';a.rel='noopener noreferrer';a.textContent=(!r.collapsed&&r.toString())||label}
  r.deleteContents();r.insertNode(a);
  const sp=document.createTextNode('\u00A0');a.after(sp);
  const nr=document.createRange();nr.setStart(sp,1);nr.collapse(true);
  sel.removeAllRanges();sel.addRange(nr);ed.lastRange=nr.cloneRange();
  commit();
}

/* ---- [[記事名]] / [[記事名§目次名]] → 記事（の目次）へのリンク ／ {{目次名}} → この記事内の目次へのリンク ----
   閉じ括弧まで入力すると、自動でリンクに変わります（全角の［］｛｝でも可） */
function makeWikiLinkEl(title,sec){
  const a=document.createElement('a');a.dataset.wt=title;a.textContent=title;
  if(sec)a.dataset.ws=sec;
  refreshWikiLink(a);
  return a;
}
function makeTocLinkEl(title){
  const a=document.createElement('a');a.dataset.toc=title;a.textContent=title;a.href='#';
  return a;
}
const LINK_RE=/[\[［]{2}([^\[\]［］]+?)[\]］]{2}|[{｛]{2}([^{}｛｝]+?)[}｝]{2}/;
function autoLink(rich){
  if(!ed||!rich)return;
  let changed=false;
  for(let guard=0;guard<30;guard++){
    const w=document.createTreeWalker(rich,NodeFilter.SHOW_TEXT,{acceptNode:n=>(n.parentElement&&n.parentElement.closest('a'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    let node,tn=null,m=null;
    while((node=w.nextNode())){const mm=LINK_RE.exec(node.nodeValue);if(mm){tn=node;m=mm;break}}
    if(!tn)break;
    const raw=(m[1]!==undefined?m[1]:m[2]).replace(/\s+/g,' ').trim();
    let title=raw,sec='';
    if(m[1]!==undefined){const k=raw.indexOf('§');if(k>=0){title=raw.slice(0,k).trim();sec=raw.slice(k+1).trim()}}
    if(!title)break;
    const sel=getSelection();
    const hadCaret=sel.rangeCount&&sel.anchorNode===tn;
    const r=document.createRange();r.setStart(tn,m.index);r.setEnd(tn,m.index+m[0].length);
    r.deleteContents();
    const a=m[1]!==undefined?makeWikiLinkEl(title,sec):makeTocLinkEl(title);
    r.insertNode(a);
    let nxt=a.nextSibling;
    if(nxt&&nxt.nodeType===3&&nxt.nodeValue===''){nxt.remove();nxt=a.nextSibling}
    const nr=document.createRange();
    if(nxt&&nxt.nodeType===3){nr.setStart(nxt,0)}
    else{const sp=document.createTextNode('\u00A0');a.after(sp);nr.setStart(sp,1)}
    nr.collapse(true);
    if(hadCaret){sel.removeAllRanges();sel.addRange(nr);ed.lastRange=nr.cloneRange()}
    changed=true;
  }
  if(changed)commit();
}

/* ---- 文字変更（色・太字・斜体・下線・大きさ） ---- */
const TEXT_COLORS=[['緑','#16a34a'],['黄','#eab308'],['赤','#dc2626'],['青','#2563eb'],['灰','#6b7280'],['黒','#000000'],['紫','#9333ea'],['水色','#38bdf8'],['オレンジ','#f97316'],['茶色','#8b5a2b'],['ピンク','#ec4899'],['黄緑','#84cc16']];
const TEXT_SIZES=[['小',13],['標準',16],['大',24],['特大',32],['最大',44]];
function clearFindMarks(){try{if(window.CSS&&CSS.highlights){CSS.highlights.delete('find-all');CSS.highlights.delete('find-cur')}}catch{}}
function closePanel(p){if(!p)return;if(p.id==='findPanel'||p.id==='vfPanel')clearFindMarks();p.remove()}

function normHex(v){
  v=String(v||'').trim().replace(/^#/,'').toLowerCase();
  if(/^[0-9a-f]{3}$/.test(v))v=v.split('').map(c=>c+c).join('');
  return /^[0-9a-f]{6}$/.test(v)?'#'+v:null;
}
/* 書式の対象：文字を選択していればその部分／選択していなければ、カーソルのある本文全体（本文をクリックしていなければ、すべての本文） */
function fmtTargets(){
  if(!ed||!ed.a.sections.length){toast('先に「目次を追加」を押してセクションを作ってください');return null}
  const r=getRange();
  if(r){const rich=richOf(r);if(rich)return {roots:[rich],range:r.collapsed?null:r}}
  const roots=$$('#editor .rich');
  return roots.length?{roots,range:null}:null;
}
function runFmt(fn){
  const t=fmtTargets();if(!t)return false;
  const sel=getSelection();let last=null;
  for(const root of t.roots){
    root.focus();
    if(t.range){sel.removeAllRanges();sel.addRange(t.range)}
    else{const rg=document.createRange();rg.selectNodeContents(root);sel.removeAllRanges();sel.addRange(rg)}
    fn(root,sel);
    if(!t.range&&sel.rangeCount)sel.collapseToEnd();
    if(sel.rangeCount)last=sel.getRangeAt(0).cloneRange();
  }
  ed.lastRange=t.roots.length>1?null:last;
  commitSoon();updateTextState();
  return true;
}
function applyColor(c){runFmt(()=>{document.execCommand('styleWithCSS',false,true);document.execCommand('foreColor',false,c)})}
function stripUnderline(root,sel){
  const r=sel.rangeCount?sel.getRangeAt(0):null;if(!r)return;
  $$('u',root).forEach(u=>{if(r.intersectsNode(u)){while(u.firstChild)u.parentNode.insertBefore(u.firstChild,u);u.remove()}});
  $$('[style*="text-decoration"]',root).forEach(el=>{if(r.intersectsNode(el)&&!el.closest('a'))el.style.textDecoration='none'});
}
function applyCmd(cmd){
  runFmt((root,sel)=>{
    const qs=c=>{try{return document.queryCommandState(c)}catch{return false}};
    const before=qs(cmd);
    document.execCommand('styleWithCSS',false,false);   // 太字・斜体・下線はタグで付ける（解除しやすい）
    document.execCommand(cmd);
    if(cmd==='underline'&&before&&qs('underline'))stripUnderline(root,sel);   // 解除できなかったときは手動で外す
  });
}
function applySize(px){
  runFmt((rich,sel)=>{
    document.execCommand('styleWithCSS',false,false);
    document.execCommand('fontSize',false,'7');
    document.execCommand('styleWithCSS',false,true);
    const made=[];
    $$('font[size="7"]',rich).forEach(f=>{
      const sp=document.createElement('span');
      sp.setAttribute('style','font-size:calc(var(--fz) * '+px+'px)');
      while(f.firstChild)sp.appendChild(f.firstChild);
      $$('[style*="font-size"]',sp).forEach(x=>x.style.removeProperty('font-size'));
      f.replaceWith(sp);made.push(sp);
    });
    if(made.length){
      const nr=document.createRange();nr.setStartBefore(made[0]);nr.setEndAfter(made[made.length-1]);
      sel.removeAllRanges();sel.addRange(nr);
    }
  });
}
/* いま選択中（またはカーソル位置）の文字の状態を、ボタンの色（灰色）で示す */
function curFmtState(){
  const r=ed&&getRange();
  const node=r?r.startContainer:$('#editor .rich');
  const el=node&&(node.nodeType===1?node:node.parentElement);if(!el)return null;
  const cs=getComputedStyle(el);
  const fz=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fz'))||1;
  return {
    bold:(+cs.fontWeight>=600||cs.fontWeight==='bold'),
    italic:cs.fontStyle==='italic'&&!el.closest('.cap-rich'),
    underline:/underline/.test(cs.textDecorationLine||cs.textDecoration||'')&&!el.closest('a'),
    size:parseFloat(cs.fontSize)/fz
  };
}
function updateTextState(){
  const p=$('#textPanel');if(!p)return;
  const st=curFmtState();if(!st)return;
  [['bold',st.bold],['italic',st.italic],['underline',st.underline]].forEach(([k,v])=>{const b=$('[data-t="'+k+'"]',p);if(b)b.classList.toggle('gray',!!v)});
  $$('[data-t="size"]',p).forEach(b=>b.classList.toggle('gray',Math.abs(st.size-(+b.dataset.px))<0.6));
}
function openTextPanel(){

  <div class="set-t" style="margin:0 0 4px">文字変更</div>

  <div class="lbl">文字の色</div>
  <div class="swatches">${TEXT_COLORS.map(([n,c])=>`<button type="button" class="swatch" data-c="${c}" title="${n}" aria-label="${n}" style="background:${c}"></button>`).join('')}</div>
  <div class="row" style="margin-top:10px"><input type="color" id="tpPick" class="color-pick" value="#2563eb" aria-label="色を選ぶ"><input id="tpHex" class="m-input" placeholder="#2563eb" maxlength="7" autocomplete="off" spellcheck="false" style="flex:1;min-width:90px"><button type="button" class="btn" data-t="color">適用</button></div>
  <div class="lbl" style="margin-top:14px">装飾</div>

  <div class="lbl" style="margin-top:14px">大きさ</div>

  document.body.appendChild(p);
  const pick=$('#tpPick',p),hex=$('#tpHex',p);

  hex.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();const c=normHex(hex.value);if(c)applyColor(c);else toast('カラーコードは #2563eb や #26b のように入力してください')}});
  p.addEventListener('click',e=>{
    const sw=e.target.closest('.swatch');
    if(sw){applyColor(sw.dataset.c);hex.value=sw.dataset.c;pick.value=sw.dataset.c;return}
    const b=e.target.closest('[data-t]');if(!b||!ed)return;
    switch(b.dataset.t){
      case 'close':closePanel(p);break;
      case 'color':{const c=normHex(hex.value)||(hex.value.trim()?null:normHex(pick.value));if(!c){toast('カラーコードは #2563eb や #26b のように入力してください');return}applyColor(c);break}
      case 'bold':case 'italic':case 'underline':applyCmd(b.dataset.t);break;
      case 'size':applySize(+b.dataset.px);break;
    }
  });
  updateTextState();
}

/* ---- 検索と置き換え（Ctrl+H） ---- */
const findRoots=()=>$$('#editor .rich,#editor .cap-rich');
function textNodesOf(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(n.parentElement&&n.parentElement.closest('a'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const out=[];let n;while((n=w.nextNode()))out.push(n);return out;
}
function findMatches(q){
  const ql=q.toLowerCase(),out=[];
  for(const root of findRoots())for(const n of textNodesOf(root)){
    const t=n.nodeValue.toLowerCase();let i=0;
    while((i=t.indexOf(ql,i))>=0){out.push({n,s:i});i+=ql.length}
  }
  return out;
}
const headFields=()=>[$('#titleInput'),...$$('#editor .sec-heading')].filter(Boolean);
function headCount(q){
  const ql=q.toLowerCase();let c=0;
  headFields().forEach(f=>{const t=f.value.toLowerCase();let i=0;while((i=t.indexOf(ql,i))>=0){c++;i+=ql.length}});
  return c;
}
function findInfo(t){const el=$('#fInfo');if(el)el.textContent=t}
function markFind(ms,cur,q){
  clearFindMarks();
  try{
    if(window.Highlight&&window.CSS&&CSS.highlights){
      const mk=m=>{const r=document.createRange();r.setStart(m.n,m.s);r.setEnd(m.n,m.s+q.length);return r};
      if(ms.length)CSS.highlights.set('find-all',new Highlight(...ms.map(mk)));
      if(cur)CSS.highlights.set('find-cur',new Highlight(mk(cur)));
      return true;
    }
  }catch{}
  return false;
}
function findRefresh(){
  const q=($('#fFind')||{}).value||'';
  if(!ed)return;
  ed.fr=null;ed.fpos=null;
  if(!q){clearFindMarks();findInfo('');return}
  const ms=findMatches(q),hc=headCount(q);
  markFind(ms,null,q);
  findInfo(`本文など ${ms.length}件`+(hc?`、見出し・目次名 ${hc}件`:''));
}
function findNext(){
  if(!ed)return;
  const q=$('#fFind').value;if(!q){findInfo('検索する単語を入力してください');return}
  const ms=findMatches(q),hc=headCount(q);
  if(!ms.length){ed.fr=null;ed.fpos=null;clearFindMarks();findInfo(hc?`本文には見つかりません（見出し・目次名に${hc}件）`:'見つかりません');return}
  let pick=null;
  if(ed.fpos&&document.body.contains(ed.fpos.startContainer)){
    for(const m of ms){const r=document.createRange();r.setStart(m.n,m.s);if(r.compareBoundaryPoints(Range.START_TO_START,ed.fpos)>=0){pick=m;break}}
  }
  if(!pick)pick=ms[0];
  const r=document.createRange();r.setStart(pick.n,pick.s);r.setEnd(pick.n,pick.s+q.length);
  ed.fr=r.cloneRange();
  const np=document.createRange();np.setStart(pick.n,pick.s+q.length);np.collapse(true);ed.fpos=np;
  if(!markFind(ms,pick,q)){const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}
  const el=pick.n.parentElement;if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});
  findInfo(`${ms.length}件中 ${ms.indexOf(pick)+1}件目`+(hc?`（ほかに見出し・目次名 ${hc}件）`:''));
}
function findReplaceOne(){
  if(!ed)return;
  const q=$('#fFind').value;if(!q)return;
  const rep=$('#fRep').value,r=ed.fr;
  if(r&&document.body.contains(r.startContainer)&&r.toString().toLowerCase()===q.toLowerCase()){
    r.deleteContents();
    const tn=document.createTextNode(rep);r.insertNode(tn);
    const np=document.createRange();np.setStartAfter(tn);np.collapse(true);ed.fpos=np;ed.fr=null;
    commit();
  }
  findNext();
}
function findReplaceAll(){
  if(!ed)return;
  const q=$('#fFind').value;if(!q){findInfo('検索する単語を入力してください');return}
  const rep=$('#fRep').value;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const ql=q.toLowerCase();
  let n=0;
  for(const root of findRoots())for(const t of textNodesOf(root)){
    if(t.nodeValue.toLowerCase().includes(ql))t.nodeValue=t.nodeValue.replace(re,()=>{n++;return rep});
  }
  headFields().forEach(f=>{if(f.value.toLowerCase().includes(ql))f.value=f.value.replace(re,()=>{n++;return rep})});
  ed.fr=null;ed.fpos=null;
  commit();findRefresh();
  findInfo(n?`${n}件を置き換えました`:'見つかりません');
}
function openFind(){
  if(!ed||ed.preview)return;

      case 'close':closePanel(p);break;

/* ---- プレビュー（保存せずに、いまの内容を閲覧モードで確認する） ---- */

  toast('画像を追加しました');
}
async function addImageUrl(url,si){
  if(!ed)return;
  const nm=(url.split('?')[0].split('/').pop()||'画像').slice(0,60);
  if(/^data:image\//i.test(url)){addMediaTo(si,{mid:uid(),type:'image',name:nm,src:url,caption:''});toast('画像を追加しました');return}
  try{
    const r=await fetch(url,{mode:'cors'});if(!r.ok)throw 0;
    const b=await r.blob();if(!/^image\//.test(b.type))throw 0;
    await addImageBlob(b,nm,si);return;
  }catch{}
  /* 取得できない（相手のサイトが許可していない）ときは、参照として入れる */
  addMediaTo(si,{mid:uid(),type:'image',name:nm,src:url,caption:''});
  toast('画像を参照として追加しました（元のサイトの都合で表示されなくなることがあります）');
}
function dropImages(e){
  const dt=e.dataTransfer;if(!dt)return false;
  const si=secIndexFor(e.target);
  const files=[...(dt.files||[])].filter(f=>/^image\//.test(f.type));
  if(files.length){files.forEach(f=>addImageBlob(f,f.name,si));return true}
  const html=dt.getData('text/html')||'',uri=((dt.getData('text/uri-list')||'').split('\n')[0]||'').trim();
  let url='';
  const m=html.match(/<img[^>]+src=["']([^"']+)["']/i);
  if(m)url=m[1].replace(/&amp;/g,'&');
  else if(/\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(uri))url=uri;
  if(!url||!/^(https?:|data:image\/)/i.test(url))return false;
  addImageUrl(url,si);return true;
}

function getBarItems(){
  const l=Array.isArray(settings.barItems)?settings.barItems.filter((x,i,a)=>BAR_DEFS[x]&&(x!=='search'||a.indexOf(x)===i)):BAR_DEFAULT.slice();
  if(!l.includes('settings'))l.push('settings');
  return l;
}
function barItemHTML(id){
  const n=BAR_DEFS[id].n;
  const btn=(key,tt)=>`<button type="button" class="icon-btn bar-it" data-bar="${key}" title="${tt||n}" aria-label="${n}">${ic(BAR_ICON[id])}<span class="bl">${n}</span></button>`;
  switch(id){
    case 'home':return `<a class="logo bar-it hdr-logo" href="#/" title="ホーム"></a>`;
    case 'back':return btn('back','1つ前のページに戻る');
    case 'fwd':return btn('fwd','次のページに進む');
    case 'fullscreen':return btn('fullscreen','全画面表示の切り替え');
    case 'space':return `<span class="bar-it bar-gap" aria-hidden="true"></span>`;
    case 'search':return `<div class="bar-it bar-search" id="barSearchSlot"></div>`;
    case 'tabs':return `<a class="tab-link bar-it" href="#/tabs" title="タブ" aria-label="タブ"><span class="tab-btn tab-count">0</span><span class="bl">タブ</span></a>`;
    default:return `<a class="icon-btn bar-it" href="${BAR_HREF[id]}" title="${n}" aria-label="${n}">${ic(BAR_ICON[id])}<span class="bl">${n}</span></a>`;
  }
}
function measureBar(){
  const h=$('#header');if(!h||!h.classList.contains('bar-h'))return;
  document.documentElement.style.setProperty('--hh',h.offsetHeight+'px');
}
function renderBar(){
  const h=$('#header'),items=getBarItems(),si=items.indexOf('search');
  /* 検索バーは必ず中央（左グループ｜検索｜右グループ）なので、どのページでも同じ位置になる */
  h.innerHTML=si<0
    ?`<div class="bar-grp">${items.map(barItemHTML).join('')}</div>`
    :`<div class="bar-grp pre">${items.slice(0,si).map(barItemHTML).join('')}</div>${barItemHTML('search')}<div class="bar-grp post">${items.slice(si+1).map(barItemHTML).join('')}</div>`;
  h.insertAdjacentHTML('beforeend','<div class="bar-resize" title="ドラッグして大きさを変える"></div>');
  const slot=$('#barSearchSlot',h);if(slot&&hdrSearch)slot.appendChild(hdrSearch.el);
  renderLogos();updateNav();updateTabBtn();measureBar();
}
let scrollHidden=false,arrowOpen=false,arrowSticky=false,arrowOpenedAt=0,toggleDragged=false;
/* 矢印で開く：sticky=true（矢印・Ctrl+M）なら矢印を押すまで閉じない／false（画面の端・なぞり）ならバーのボタンやバー以外を押すと閉じる */
function setArrow(open,sticky){arrowOpen=open;arrowSticky=open&&!!sticky;if(open)arrowOpenedAt=Date.now();applyBar()}
/* ▽△ボタンの位置（ページバーが上下なら左右に、左右なら上下に動かせる） */
function placeToggle(){
  const t=$('#barToggle');if(!t)return;
  t.style.left=t.style.right=t.style.top=t.style.bottom=t.style.marginTop='';
  const f=settings.barToggleFrac;if(typeof f!=='number')return;
  if(isVertical()){t.style.top=Math.round(f*(window.innerHeight-40))+'px';t.style.marginTop='0'}
  else{t.style.left=Math.round(f*(window.innerWidth-40))+'px';t.style.right='auto'}
}
window.addEventListener('resize',placeToggle);
(function(){
  const t=$('#barToggle');let d=null;
  t.addEventListener('pointerdown',e=>{d={pid:e.pointerId,sx:e.clientX,sy:e.clientY,on:false}});
  t.addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.pid)return;
    if(!d.on){if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<8)return;d.on=true;t.classList.add('dragging');try{t.setPointerCapture(e.pointerId)}catch{}}
    e.preventDefault();
    const v=isVertical();
    const f=v?(e.clientY-20)/(window.innerHeight-40):(e.clientX-20)/(window.innerWidth-40);
    settings.barToggleFrac=Math.max(0,Math.min(1,f));placeToggle();
  });
  const end=e=>{
    if(!d||e.pointerId!==d.pid)return;
    const was=d.on;d=null;t.classList.remove('dragging');
    if(was){toggleDragged=true;setTimeout(()=>{toggleDragged=false},0);LS.set('mywiki.settings',settings)}
  };
  t.addEventListener('pointerup',end);t.addEventListener('pointercancel',end);
})();
/* 画面の端から開く方法：①端にカーソルを近づける ②端をクリック ③端から内側へなぞる（スクロール） */
const edgeBox=()=>({w:document.documentElement.clientWidth,h:document.documentElement.clientHeight});
function nearEdge(x,y,px){const p=currentPos(),b=edgeBox();return p==='top'?y<=px:p==='bottom'?y>=b.h-px:p==='left'?x<=px:x>=b.w-px}
function inwardDist(dx,dy){const p=currentPos();return p==='top'?dy:p==='bottom'?-dy:p==='left'?dx:-dx}
const arrowClosed=()=>settings.barMode==='arrow'&&!arrowOpen&&!PANE;
document.addEventListener('mousemove',e=>{if(e.buttons||!arrowClosed())return;if(nearEdge(e.clientX,e.clientY,3))setArrow(true,false)});
document.addEventListener('pointerdown',e=>{
  if(!arrowClosed())return;
  if(e.target.closest&&e.target.closest('#barToggle,.modal-back,.float-panel'))return;
  if(nearEdge(e.clientX,e.clientY,14))setArrow(true,false);
});
(function(){
  let ts=null,ms=null;
  document.addEventListener('touchstart',e=>{if(!arrowClosed()||e.touches.length!==1){ts=null;return}const t=e.touches[0];ts=nearEdge(t.clientX,t.clientY,28)?{x:t.clientX,y:t.clientY}:null},{passive:true});
  document.addEventListener('touchmove',e=>{if(!ts)return;if(!arrowClosed()){ts=null;return}const t=e.touches[0];if(inwardDist(t.clientX-ts.x,t.clientY-ts.y)>=28){ts=null;setArrow(true,false)}},{passive:true});
  document.addEventListener('touchend',()=>{ts=null},{passive:true});
  document.addEventListener('mousedown',e=>{ms=(arrowClosed()&&nearEdge(e.clientX,e.clientY,28))?{x:e.clientX,y:e.clientY}:null});
  document.addEventListener('mousemove',e=>{if(ms&&e.buttons&&arrowClosed()&&inwardDist(e.clientX-ms.x,e.clientY-ms.y)>=28){ms=null;setArrow(true,false)}});
  document.addEventListener('mouseup',()=>{ms=null});
})();
/* 矢印を押して（またはCtrl+Mで）開いたときは、矢印を押すまで閉じない。画面の端から開いたときだけ、バーのボタンやバー以外を押すと閉じる（検索履歴の×では閉じない） */
document.addEventListener('click',e=>{
  if(settings.barMode!=='arrow'||!arrowOpen||arrowSticky)return;
  if(Date.now()-arrowOpenedAt<450)return;
  const t=e.target;
  if(t.closest('#barToggle,.dd-x'))return;
  if(t.closest('#header')){if(t.closest('a,button,.dd-row'))setTimeout(()=>{arrowOpen=false;arrowSticky=false;applyBar()},0);return}
  if(t.closest('.modal-back,.float-panel'))return;
  arrowOpen=false;arrowSticky=false;applyBar();
});
/* ページバーの端をドラッグして、バーの大きさを変える */
(function(){
  let d=null;
  document.addEventListener('pointerdown',e=>{
    const h=e.target.closest&&e.target.closest('.bar-resize');if(!h)return;
    const r=$('#header').getBoundingClientRect();
    d={pid:e.pointerId,h,sc:+settings.barScale||1,size:isVertical()?r.width:r.height,x:e.clientX,y:e.clientY};
    h.classList.add('on');try{h.setPointerCapture(e.pointerId)}catch{}
    e.preventDefault();
  });
  document.addEventListener('pointermove',e=>{
    if(!d||e.pointerId!==d.pid)return;
    const p=currentPos();
    const delta=p==='top'?e.clientY-d.y:p==='bottom'?d.y-e.clientY:p==='left'?e.clientX-d.x:d.x-e.clientX;
    const sc=Math.max(.7,Math.min(1.8,d.sc*(d.size+delta)/d.size));
    settings.barScale=sc;document.documentElement.style.setProperty('--bsc',String(sc));measureBar();
  });
  const end=e=>{if(!d||e.pointerId!==d.pid)return;d.h.classList.remove('on');d=null;LS.set('mywiki.settings',settings)};
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
})();
function applyBar(){
  const arrow=settings.barMode==='arrow',pos=currentPos();
  const hide=arrow?!arrowOpen:(settings.barMode==='always'?false:scrollHidden);
  $('#header').classList.toggle('hide',hide);
  document.body.classList.toggle('hdr-hidden',hide);
  document.body.classList.toggle('bar-opened',arrow&&arrowOpen);
  const t=$('#barToggle');t.hidden=!arrow;
  if(arrow){
    const closed={top:0,bottom:180,left:-90,right:90},open={top:180,bottom:0,left:90,right:-90};
    const sv=t.firstElementChild;if(sv)sv.style.transform='rotate('+(arrowOpen?open:closed)[pos]+'deg)';
    t.title=arrowOpen?'ページバーを閉じる':'ページバーを開く';
    placeToggle();
  }
}
function applyBarSettings(){
  if(PANE){document.body.classList.add('pane');return}
  document.documentElement.style.setProperty('--bsc',String(Math.max(.7,Math.min(1.8,+settings.barScale||1))));
  const pos=currentPos(),b=document.body;
  ['top','bottom','left','right'].forEach(p=>b.classList.toggle('bar-'+p,p===pos));
  const arrow=settings.barMode==='arrow';
  b.classList.toggle('bar-arrow',arrow);b.classList.toggle('bar-default',!arrow);
  $('#header').className=isVertical()?'bar-v':'bar-h';
  renderBar();applyBar();
}
const saveBarItems=l=>{settings.barItems=l;LS.set('mywiki.settings',settings);renderBar()};

/* ---- 設定：ページバーの並び順（ドラッグで入れ替え／クリックで×） ---- */
function mockInner(id){
  const n=BAR_DEFS[id].n;
  if(id==='space')return `<span class="mi-space">空白</span>`;
  if(id==='home')return logoHTML('');
  if(id==='search')return `<span class="mi-search">${ic('search',16)}<span>YUpediaを検索</span></span>`;
  if(id==='tabs')return `<span class="tab-btn">${tabs.length>99?'99+':tabs.length}</span><span class="bl">${n}</span>`;
  return `${ic(BAR_ICON[id])}<span class="bl">${n}</span>`;
}
function mockItem(id,i,arr){
  const lock=id==='settings'&&arr.filter(x=>x==='settings').length<=1;
  return `<div class="mi" data-id="${id}" title="${BAR_DEFS[id].n}">${mockInner(id)}${lock?'':`<button type="button" class="mi-x" data-act="bar-x" title="このボタンを消す">${ic('x',12)}</button>`}</div>`;
}
function addMenuHTML(){
  const cur=getBarItems();
  return Object.keys(BAR_DEFS).filter(k=>k!=='search'||!cur.includes('search')).map(k=>{
    const icon=k==='space'?'<span class="mi-space">空白</span>':k==='tabs'?'<span class="tab-btn" style="width:22px;height:22px;border-width:2px;font-size:12px">'+tabs.length+'</span>':ic(k==='home'?'home':BAR_ICON[k],18);
    return `<button type="button" data-act="bar-add" data-id="${k}" title="${k==='space'?'ボタンの間隔を空けます':BAR_DEFS[k].n+'を追加'}">${icon}${k==='space'?'':BAR_DEFS[k].n}</button>`;
  }).join('');
}
function mockHTML(){
  return `<div class="mock-wrap"><div class="mock-bar ${isVertical()?'v':'h'}" id="mockBar">${getBarItems().map(mockItem).join('')}</div></div><div class="lbl" style="margin-top:16px">追加できるボタン（押すと最後に追加。ドラッグすると好きな位置に追加できます。ページバーのボタンをこの欄にドラッグすると消せます。同じボタンを何個でも置けます）</div><div id="mockMenu" class="mock-menu">${addMenuHTML()}</div>`;
}
function initMock(){
  const bar=$('#mockBar');if(!bar)return;
  let drag=null;
  bar.addEventListener('pointerdown',e=>{
    if(e.target.closest('.mi-x'))return;
    const it=e.target.closest('.mi');if(!it)return;
    const r=it.getBoundingClientRect();
    drag={it,sx:e.clientX,sy:e.clientY,gx:e.clientX-r.left,gy:e.clientY-r.top,on:false,pid:e.pointerId};
  });
  bar.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.pid)return;
    if(!drag.on){
      if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
      drag.on=true;drag.it.classList.add('dragging');
      $$('.mi.sel',bar).forEach(x=>x.classList.remove('sel'));
      try{bar.setPointerCapture(e.pointerId)}catch{}
    }
    e.preventDefault();
    const it=drag.it;it.style.transform='none';
    let best=null,bd=Infinity;
    for(const c of [...bar.children]){
      if(c===it||!c.classList.contains('mi'))continue;
      const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      const d=(e.clientX-cx)**2+(e.clientY-cy)**2;
      if(d<bd){bd=d;best={c,cx,cy}}
    }
    if(best){
      const before=bar.classList.contains('v')?e.clientY<best.cy:e.clientX<best.cx;
      const ref=before?best.c:best.c.nextElementSibling;
      if(ref!==it&&it.nextElementSibling!==ref)bar.insertBefore(it,ref);
    }
    const r0=it.getBoundingClientRect();
    it.style.transform=`translate(${e.clientX-drag.gx-r0.left}px,${e.clientY-drag.gy-r0.top}px)`;
    const mn=$('#mockMenu');
    if(mn){const r=mn.getBoundingClientRect();mn.classList.toggle('del-target',e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)}
  });
  const end=e=>{
    if(!drag||e.pointerId!==drag.pid)return;
    const d=drag;drag=null;
    if(d.on){
      d.it.classList.remove('dragging');d.it.style.transform='';
      const mn=$('#mockMenu');let del=false;
      if(mn){mn.classList.remove('del-target');const r=mn.getBoundingClientRect();del=e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}
      if(del){   // 「追加できるボタン」の欄にドラッグすると消える
        const id=d.it.dataset.id,rest=$$('.mi',bar).filter(x=>x!==d.it).map(x=>x.dataset.id);
        if(id==='settings'&&!rest.includes('settings')){toast('設定ボタンは最低1つ必要です');saveBarItems($$('.mi',bar).map(x=>x.dataset.id))}
        else{saveBarItems(rest);toast('ボタンを消しました')}
        rerenderSettings();return;
      }
      saveBarItems($$('.mi',bar).map(x=>x.dataset.id));
    }else{
      const was=d.it.classList.contains('sel');
      $$('.mi.sel',bar).forEach(x=>x.classList.remove('sel'));
      if(!was)d.it.classList.add('sel');
    }
  };
  bar.addEventListener('pointerup',end);
  bar.addEventListener('pointercancel',end);
  /* 「追加できるボタン」をドラッグして、ページバーの好きな位置に追加する */
  const menu=$('#mockMenu');
  if(menu){
    let md=null;
    const putPh=(x,y)=>{
      const ph=md.ph,its=[...bar.children].filter(c=>c.classList.contains('mi'));
      if(!its.length){bar.appendChild(ph);return}
      let best=null,bd=Infinity;
      for(const c of its){const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dd=(x-cx)**2+(y-cy)**2;if(dd<bd){bd=dd;best={c,cx,cy}}}
      const before=bar.classList.contains('v')?y<best.cy:x<best.cx;
      let ref=before?best.c:best.c.nextElementSibling;
      while(ref&&ref!==ph&&!ref.classList.contains('mi'))ref=ref.nextElementSibling;
      if(ref===ph)return;
      bar.insertBefore(ph,ref);
    };
    menu.addEventListener('pointerdown',e=>{
      const b=e.target.closest('[data-act="bar-add"]');if(!b)return;
      md={id:b.dataset.id,b,sx:e.clientX,sy:e.clientY,pid:e.pointerId,on:false,ghost:null,ph:null};
    });
    menu.addEventListener('pointermove',e=>{
      if(!md||e.pointerId!==md.pid)return;
      if(!md.on){
        if(Math.hypot(e.clientX-md.sx,e.clientY-md.sy)<6)return;
        md.on=true;try{menu.setPointerCapture(e.pointerId)}catch{}
        const g=md.b.cloneNode(true);g.className='drag-ghost';g.style.cssText='position:fixed;z-index:500;pointer-events:none;opacity:.92';
        document.body.appendChild(g);md.ghost=g;
        md.ph=document.createElement('div');md.ph.className='mi-ph';
      }
      e.preventDefault();
      md.ghost.style.left=(e.clientX-20)+'px';md.ghost.style.top=(e.clientY-20)+'px';
      const r=bar.getBoundingClientRect();
      const inside=e.clientX>=r.left-24&&e.clientX<=r.right+24&&e.clientY>=r.top-24&&e.clientY<=r.bottom+24;
      if(inside)putPh(e.clientX,e.clientY);else if(md.ph.parentNode)md.ph.remove();
    });
    const mend=e=>{
      if(!md||e.pointerId!==md.pid)return;
      const d=md;md=null;
      if(!d.on)return;
      let idx=-1;
      if(d.ph&&d.ph.parentNode===bar)idx=[...bar.children].filter(c=>c.classList.contains('mi')||c===d.ph).indexOf(d.ph);
      if(d.ghost)d.ghost.remove();if(d.ph)d.ph.remove();
      if(idx>=0){
        const l=getBarItems();
        if(d.id==='search'&&l.includes('search')){toast('検索バーは1つだけ置けます');return}
        l.splice(idx,0,d.id);saveBarItems(l);rerenderSettings();
      }
    };
    menu.addEventListener('pointerup',mend);menu.addEventListener('pointercancel',mend);
  }
}

function toggleFullscreen(){
  const d=document,el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
  else{
    const f=el.requestFullscreen||el.webkitRequestFullscreen;
    if(!f){toast('この端末・ブラウザでは全画面表示にできません');return}
    Promise.resolve(f.call(el)).catch(()=>toast('全画面表示にできませんでした'));
  }
}
/* ヘッダーのスクロール表示切り替え／上部へ戻るボタン */
let lastY=0;
const hasOpenDD=()=>$$('.s-dd').some(d=>!d.hidden);
function hideHeader(){scrollHidden=true;applyBar()}
function showHeader(){scrollHidden=false;applyBar()}
window.addEventListener('scroll',()=>{
  const y=window.scrollY;
  const tb=$('#toTopBtn');if(tb)tb.hidden=!(y>400);
  const bmode=settings.barMode;
  if(bmode==='arrow'){lastY=y;return}
  if(bmode==='always')return;
  if(bmode==='attop'){const hid=y>20;if(hid!==scrollHidden){scrollHidden=hid;applyBar()}return}
  if(Math.abs(y-lastY)<6)return;
  if(y>lastY&&y>60){if(!hasOpenDD())hideHeader()}else showHeader();
  lastY=y;
},{passive:true});

/* ================= 起動 ================= */
(async function init(){
  applyTheme();applyFont();applyFontFamily();
  $('#header').addEventListener('click',e=>{
    const bb=e.target.closest('[data-bar]');if(!bb)return;
    switch(bb.dataset.bar){
      case 'back':if(curDepth>0)history.back();break;
      case 'fwd':if(curDepth<maxDepth)history.forward();break;
      case 'fullscreen':toggleFullscreen();break;
    }
  });
  $('#toTopBtn').innerHTML=ic('up');
  $('#vfBtn').innerHTML=ic('search',22);
  $('#vfBtn').addEventListener('click',openViewFind);
  $('#prevTelop .btn').addEventListener('click',endPreview);
  $('#toTopBtn').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  $('#barToggle').innerHTML=ic('tri',22);
  $('#barToggle').addEventListener('click',()=>{if(toggleDragged)return;setArrow(!arrowOpen,true)});
  const st0=history.state;
  if(st0&&typeof st0.d==='number')curDepth=st0.d;
  else{try{history.replaceState({d:0},'')}catch{}}
  maxDepth=curDepth;
  updateNav();
  hdrSearch=buildSearch(false);
  applyBarSettings();
  if(window.ResizeObserver)new ResizeObserver(measureBar).observe($('#header'));
  try{
    await DB.open();
    const allRec=(await DB.all())||[];
    state.articles=allRec.filter(a=>!a.trashed);
    state.trash=allRec.filter(a=>a.trashed);
    const old=state.trash.filter(a=>Date.now()-a.trashed>TRASH_DAYS*86400000);
    for(const a of old){try{await DB.del(a.id)}catch{}}
    state.trash=state.trash.filter(a=>!old.includes(a));
    ((await DB.allAssets())||[]).forEach(r=>{if(r&&r.key in assets)assets[r.key]=r.src});
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch{toast('記事の保存領域を開けませんでした（このセッションのみ有効）')}
  applyBg();renderLogos();applyFavicon();
  route();
})();
</script>
