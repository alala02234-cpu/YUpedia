
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YUpedia</title>
<!-- ファビコン：パスは下の script 先頭の ASSETS で指定します（見つからない場合は内蔵アイコンを使います） -->
<link id="favicon" rel="icon">
<link id="touchicon" rel="apple-touch-icon">
<style>
:root{
  --hh:64px;--bw:220px;--logo-h:52px;--ib:40px;--sbh:40px;--bsc:1;--bwx:calc(var(--bw) * var(--bsc));
  --sh:52px;
  --fz:1;
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --bg:#ffffff;--card:#ffffff;--text:#111827;--sub:#6b7280;--border:#e5e7eb;--input:#f5f6f8;
  --primary:#2563eb;--link:#1d4ed8;--tag:#2563eb;--hover:rgba(0,0,0,.07);--shadow:0 2px 12px rgba(0,0,0,.12);
  --panel:rgba(255,255,255,.88);--line:#9ca3af;
}
body.dark{
  --bg:#000000;--card:#111318;--text:#f3f4f6;--sub:#9ca3af;--border:#2a2e37;--input:#1a1d24;
  --primary:#3b82f6;--link:#6ea8ff;--tag:#60a5fa;--hover:rgba(255,255,255,.12);--shadow:0 2px 12px rgba(255,255,255,.08);
  --panel:rgba(12,14,18,.8);--line:#6b7280;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;overflow-y:scroll}
body{background:var(--bg);color:var(--text);font-size:calc(16px*var(--fz));font-family:var(--ff);line-height:1.6;transition:background .2s,color .2s}
button,input,select{font:inherit;color:inherit}
a{color:var(--link)}

/* ===== 背景画像（設定の「インポートする」） ===== */
body.has-bg::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgimg) center/cover no-repeat}
body.has-bg .page,body.has-bg .all-list{background:var(--panel);border-radius:18px}
body.has-bg .page{margin-top:10px;margin-bottom:10px}
body.has-bg .count{background:var(--panel)}

/* ===== ロゴ（画像全体をそのまま表示／画像が無いときは文字ロゴ／背景は常に透明） ===== */
.logo-crop{position:relative;display:block;overflow:hidden;aspect-ratio:3/1;background:transparent;border-radius:8px;container-type:inline-size}
.logo-crop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.logo-crop .wm{display:none;position:absolute;inset:0;align-items:center;justify-content:center;font-weight:800;font-size:20px;font-size:24cqw;letter-spacing:-.01em;color:#f29b42;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;line-height:1}
.logo-crop .wm b{color:#1e7bc9;font-weight:800}
.logo-crop.nofile .wm{display:flex}
.logo-crop.nofile img{display:none}
.logo .logo-crop{width:min(calc(var(--logo-h) * 3),42vw)}
.logo-crop.big{width:min(520px,84vw);border-radius:12px}

/* ===== ページバー（ヘッダー） ===== */
body{--ot:0px;--ob:0px;--ol:0px;--or:0px}
body.bar-top.bar-default{--ot:var(--hh)}
body.bar-bottom.bar-default{--ob:var(--hh)}
@media(min-width:821px){
  body.bar-left.bar-default{--ol:var(--bwx)}
  body.bar-right.bar-default{--or:var(--bwx)}
}
#header{position:fixed;z-index:100;background:var(--card);display:flex;gap:6px;transition:transform .3s ease,opacity .3s ease}
#header.bar-h{left:0;right:0;flex-wrap:wrap;align-items:center;padding:6px 16px;min-height:56px}
#header.bar-v{top:0;bottom:0;width:var(--bwx);flex-direction:column;align-items:stretch;padding:12px;gap:4px}
body.bar-top #header{top:0;border-bottom:1px solid var(--border)}
body.bar-bottom #header{bottom:0;border-top:1px solid var(--border)}
body.bar-left #header{left:0;border-right:1px solid var(--border)}
body.bar-right #header{right:0;border-left:1px solid var(--border)}
#header.hide{opacity:0;pointer-events:none}
body.bar-top #header.hide{transform:translateY(-100%)}
body.bar-bottom #header.hide{transform:translateY(100%)}
body.bar-left #header.hide{transform:translateX(-100%)}
body.bar-right #header.hide{transform:translateX(100%)}
#header.bar-h .bar-search{flex:0 1 560px;width:560px;max-width:100%;min-width:0;margin:0}
.bar-grp{display:flex;align-items:center;gap:6px;flex:1 1 0;min-width:0}
.bar-grp.post{justify-content:flex-end}
#header.bar-v .bar-grp{display:contents}
#header.bar-v .bar-search{width:100%}
#header .s-dd{z-index:300}
body.bar-bottom #header .s-dd{top:auto;bottom:calc(100% + 6px)}
.bl{display:none}
#header.bar-v .bl{display:inline;font-size:calc(15px*var(--fz))}
#header.bar-v .icon-btn,#header.bar-v .tab-link{width:100%;height:auto;min-height:40px;border-radius:10px;display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:6px 10px;text-align:left}
#header.bar-v .tab-link:hover{background:var(--hover)}
#header.bar-v .logo,#header.bar-v .logo .logo-crop{width:100%}
.logo{display:block;line-height:0;flex:none}
.bar-gap{flex:none;width:28px;height:1px}
#header.bar-v .bar-gap{width:100%;height:18px}
.tab-link{display:inline-flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;flex:none}
.icon-btn{width:40px;height:40px;border:0;background:transparent;color:var(--text);border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;text-decoration:none;flex:none}
.icon-btn:hover:not(:disabled){background:var(--hover)}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn.danger:hover{color:#dc2626}
.icon-btn.star.on{color:#f59e0b}
.icon-btn.star:hover{color:#f59e0b}
/* ▽△ の開閉ボタン（「矢印」設定） */
.bar-toggle{position:fixed;z-index:105;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;padding:0;transition:top .3s ease,bottom .3s ease,left .3s ease,right .3s ease}
.bar-toggle svg{transition:transform .3s ease}
body.bar-top .bar-toggle{top:8px;right:12px}
body.bar-top.bar-opened .bar-toggle{top:calc(var(--hh) + 8px)}
body.bar-bottom .bar-toggle{bottom:8px;right:12px}
body.bar-bottom.bar-opened .bar-toggle{bottom:calc(var(--hh) + 8px)}
body.bar-left .bar-toggle{left:8px;top:50%;margin-top:-20px}
body.bar-left.bar-opened .bar-toggle{left:calc(var(--bwx) + 8px)}
body.bar-right .bar-toggle{right:8px;top:50%;margin-top:-20px}
body.bar-right.bar-opened .bar-toggle{right:calc(var(--bwx) + 8px)}

/* ===== 検索バー ===== */
.search-wrap{position:relative;width:100%}
.search-wrap.big{width:min(1000px,100%)}
.search-box{position:relative;display:flex;align-items:center;height:40px;background:var(--input);border:1px solid var(--border);border-radius:999px;padding:0 6px}
.search-wrap.big .search-box{height:58px;padding:0 10px}
.s-btn{width:34px;height:34px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--sub);flex:none}
.s-btn:hover{background:var(--hover);color:var(--text)}
.s-input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0 8px;font-size:calc(15px*var(--fz))}
.search-wrap.big .s-input{font-size:calc(18px*var(--fz))}
.s-dd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;z-index:200}
.dd-row{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 8px 6px 16px;min-height:40px;cursor:pointer}
.dd-row:hover,.dd-row.sel{background:var(--hover)}
.dd-w b,.r-title b,.r-snip b{font-weight:900;color:var(--text)}
.r-title b{text-decoration:underline}
.dd-w{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:4px}
.dd-none{padding:10px 16px;color:var(--sub);font-size:calc(14px*var(--fz))}
.dd-x{width:28px;height:28px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--sub);flex:none}
.dd-x:hover{background:var(--hover);color:var(--text)}

/* ===== サブバー（ページ作成時） ===== */
.subbar{position:fixed;left:var(--ol);right:var(--or);top:var(--ot);height:var(--sh);display:flex;justify-content:center;justify-content:safe center;align-items:center;gap:8px;padding:0 10px;background:var(--card);border-bottom:1px solid var(--border);z-index:90;transition:top .3s ease;overflow-x:auto}
body.hdr-hidden .subbar{top:0}
.tb{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;cursor:pointer;font-size:calc(14px*var(--fz));white-space:nowrap}
.tb:hover:not(:disabled){background:var(--hover)}
.tb:disabled{opacity:.35;cursor:default}
.tb[data-act=tb-url] svg{color:#2563eb}.tb[data-act=tb-image] svg{color:#10b981}.tb[data-act=tb-video] svg{color:#ef4444}.tb[data-act=tb-audio] svg{color:#a855f7}.tb[data-act=tb-text] svg{color:#f59e0b}
.tb-sep{width:1px;height:24px;background:var(--border)}

/* ===== ページ共通 ===== */
#view{padding:var(--ot) var(--or) var(--ob) var(--ol);min-height:100vh}
body.editing #view{padding-top:calc(var(--ot) + var(--sh))}
.page{max-width:900px;margin:0 auto;padding:24px 20px 100px}
.page.wide{max-width:1120px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.head-btns{display:flex;gap:8px;flex-wrap:wrap}
.h1{font-size:calc(28px*var(--fz));margin:0;overflow-wrap:anywhere}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.card.pad{padding:22px}
.empty{text-align:center;color:var(--sub);padding:60px 0;font-size:calc(18px*var(--fz))}
.empty-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{display:inline-block;padding:8px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;text-decoration:none;font-size:calc(15px*var(--fz))}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--primary);color:#fff;border-color:transparent}
.btn.primary:hover{filter:brightness(1.08);background:var(--primary)}
.btn.danger{background:#dc2626;color:#fff;border-color:transparent}
.btn.danger:hover:not(:disabled){filter:brightness(1.08);background:#dc2626}
.mini-btn{padding:4px 12px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;cursor:pointer;font-size:calc(13px*var(--fz))}
.mini-btn:hover{background:var(--hover)}

/* ===== タブボタン ===== */
.tab-btn{width:34px;height:34px;border:2px solid var(--text);border-radius:8px;display:inline-grid;place-items:center;font-size:calc(14px*var(--fz));font-weight:700;line-height:1;color:var(--text);flex:none;background:transparent}
.tab-link:hover .tab-btn{background:var(--hover)}
/* ===== タブのページ ===== */
.tab-list{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:10px}
.tab-row{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:4px 6px 4px 4px}
.tab-row.on{border-color:var(--primary)}
.tab-name{flex:1;min-width:0;text-align:left;background:none;border:0;cursor:pointer;padding:12px 14px;border-radius:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-size:calc(16px*var(--fz))}
.tab-name:hover{background:var(--hover)}
.modal-box.square .u-res{max-height:120px}

/* ===== ホーム ===== */
.home-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding:0 20px;align-items:center}
.home-grid.two{grid-template-columns:250px minmax(0,1fr) 250px}
.home-top{min-width:0;height:calc(100vh - var(--ot) - var(--ob));height:calc(100dvh - var(--ot) - var(--ob));min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:0 4px}
.home-side{width:100%;max-width:250px;max-height:calc(100vh - var(--ot) - var(--ob) - 60px);overflow:auto;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.home-side.left{justify-self:start}
.home-side.right{justify-self:end}
.home-side ul{list-style:none;margin:0;padding:0}
.hs-t{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px;min-height:32px}
.hs-t.bm svg{color:#f59e0b}
.hs-tl{color:inherit;text-decoration:none}
.hs-tl:hover{text-decoration:underline}
.hs-sort{margin-left:auto;min-width:0;max-width:110px;font-size:calc(12px*var(--fz));padding:3px 4px;border:1px solid var(--border);background:var(--input);border-radius:6px;color:var(--text);cursor:pointer}
.hs-item{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;cursor:pointer;color:var(--text);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:calc(14px*var(--fz))}
.hs-item:hover{background:var(--hover)}
.hs-none{color:var(--sub);font-size:calc(14px*var(--fz));padding:6px 8px}
.count{display:inline-block;background:none;border:0;cursor:pointer;color:inherit;font-size:calc(16px*var(--fz));text-decoration:underline;padding:6px 14px;border-radius:8px}
.count:hover{background:var(--hover)}
.all-list{max-width:640px;margin:0 auto;padding:16px 20px 100px;scroll-margin-top:8px}
.all-list ul{list-style:none;margin:0;padding:0}
.all-list li a{display:block;padding:11px 12px;border-bottom:1px solid var(--border);text-decoration:none}
.all-list li a:hover{background:var(--hover)}

/* ===== 検索結果 ===== */
.count-note{color:var(--sub);margin:6px 0 10px}
.result{padding:14px 0;border-bottom:1px solid var(--border)}
.r-row{display:flex;align-items:center;gap:2px}
.r-title{font-size:calc(20px*var(--fz));font-weight:600;text-decoration:none;color:var(--link);min-width:0;overflow-wrap:anywhere;margin-right:6px;flex:0 1 auto}
.r-title:hover{text-decoration:underline}
.r-url{font-size:calc(12px*var(--fz));color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-snip{color:var(--sub);font-size:calc(14px*var(--fz));margin-top:4px}

/* ===== 記事表示 ===== */
.art-head{display:flex;align-items:center;gap:4px;margin-bottom:18px;flex-wrap:wrap}
.art-head .h1{margin-right:8px}
.ver-banner{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:calc(14px*var(--fz))}
.ver-banner a{margin-left:10px}
.ver-banner .mini-btn{margin-left:10px}
.art-wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.toc{position:sticky;top:calc(var(--ot) + 16px);border:1px solid var(--border);background:var(--input);border-radius:12px;padding:14px 18px;transition:top .3s ease}
body.hdr-hidden .toc{top:16px}
.toc-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toc-t{font-weight:700}
.toc-close{background:none;border:0;color:var(--sub);cursor:pointer;font-size:calc(13px*var(--fz));text-decoration:underline;padding:2px 4px;border-radius:6px}
.toc-close:hover{color:var(--text);background:var(--hover)}
.toc ol{margin:6px 0 0;padding-left:22px}
.toc-link{display:block;width:100%;background:none;border:0;color:var(--link);cursor:pointer;padding:3px 0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toc-link:hover{text-decoration:underline}
.toc-open{display:none}
.page.toc-closed .toc{display:none}
.page.toc-closed .toc-open{display:inline-block}
.page.toc-closed .art-wrap{grid-template-columns:minmax(0,1fr)}
.page.toc-closed .art-head,.page.toc-closed .art-wrap,.page.toc-closed .ver-banner{max-width:820px;margin-left:auto;margin-right:auto}
.v-sec{scroll-margin-top:calc(var(--ot) + 12px)}
.v-sec:first-child h2{margin-top:0}
.v-sec h2{font-size:calc(22px*var(--fz));border-bottom:2px solid var(--line);padding-bottom:6px;margin:28px 0 12px}
.v-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}
.v-grid.full{grid-template-columns:1fr}
.rich-view,.rich{white-space:pre-wrap;word-break:break-word;line-height:1.8}
.v-media figure{margin:0 0 14px}
.v-media img{max-width:100%;width:100%;border-radius:10px;display:block;cursor:zoom-in}
.figcap{font-size:calc(13px*var(--fz));color:var(--sub);font-style:italic;text-align:center;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.figcap a{color:var(--link);text-decoration:underline}
.v-aud{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:14px;background:var(--input)}
.v-aud audio,.media.aud audio{width:100%}
.v-vid{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:14px;background:var(--input)}
.v-vid video,.media.vid video{width:100%;border-radius:8px;display:block}
.totop{position:fixed;right:calc(18px + var(--or));bottom:calc(18px + var(--ob));z-index:120;background:var(--primary);color:#fff;width:46px;height:46px;box-shadow:var(--shadow);transition:opacity .2s,transform .2s}
.totop:hover{filter:brightness(1.1)}
.fname{font-size:calc(12px*var(--fz));color:var(--sub);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:26px}
.rich a,.rich-view a,.cap-rich a{color:var(--link)!important;text-decoration:underline!important}
/* 存在しない見出しへのリンク：赤＋下線 */
.rich a.wl-missing,.rich-view a.wl-missing,.cap-rich a.wl-missing,.figcap a.wl-missing{color:#dc2626!important;text-decoration:underline!important}
body.dark .rich a.wl-missing,body.dark .rich-view a.wl-missing,body.dark .cap-rich a.wl-missing,body.dark .figcap a.wl-missing{color:#f87171!important}
body.dark .rich [style*="rgb(0, 0, 0)"],body.dark .rich-view [style*="rgb(0, 0, 0)"],
body.dark .cap-rich [style*="rgb(0, 0, 0)"],body.dark .figcap [style*="rgb(0, 0, 0)"],
body.dark .rich font[color="#000000"],body.dark .rich-view font[color="#000000"],
body.dark .cap-rich font[color="#000000"],body.dark .figcap font[color="#000000"]{color:var(--text)!important}

/* ===== エディタ ===== */
.field-label{font-size:calc(13px*var(--fz));font-weight:700;color:var(--sub);margin:10px 4px 6px}
.title-input,.sec-heading,.m-input{width:100%;border:1px solid var(--border);background:var(--input);border-radius:10px;padding:10px 12px;outline:0}
.title-input{font-size:calc(22px*var(--fz));font-weight:700}
.title-input:focus,.sec-heading:focus,.m-input:focus,.rich:focus{border-color:var(--primary)}
.section{margin-top:20px}
.sec-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec-no{font-size:calc(13px*var(--fz));font-weight:700;color:var(--primary)}
.sec-del{width:30px;height:30px;border:0;background:transparent;border-radius:50%;cursor:pointer;color:var(--sub);display:grid;place-items:center}
.sec-del:hover{background:var(--hover);color:#dc2626}
.sec-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:stretch}
.lbl{display:block;font-size:calc(12px*var(--fz));font-weight:700;color:var(--sub);margin:10px 0 6px}
.lbl:first-child{margin-top:0}
.rich{min-height:170px;padding:12px;border:1px solid var(--border);background:var(--input);border-radius:10px;outline:0}
.sec-right{border:1px solid var(--border);background:var(--input);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.media-empty{margin:auto;color:var(--sub);font-size:calc(13px*var(--fz));opacity:.7}
.slot{border:2px dashed var(--primary);color:var(--primary);background:transparent;border-radius:10px;padding:10px;cursor:pointer}
.slot:hover{background:var(--hover)}
.media{position:relative}
.img-wrap{position:relative}
.img-wrap img{width:100%;display:block;border-radius:10px}
.m-del{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:#dc2626;color:#fff;border:0;display:grid;place-items:center;cursor:pointer;padding:0;z-index:2}
.cap-rich{margin-top:6px;min-height:38px;padding:8px 10px;border:1px solid var(--border);background:var(--card);border-radius:10px;outline:0;font-size:calc(13px*var(--fz));font-style:italic;text-align:center;white-space:pre-wrap;word-break:break-word}
.cap-rich:focus{border-color:var(--primary)}
.cap-rich:empty::before{content:attr(data-ph);color:var(--sub);opacity:.7}
.media.aud{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px}
.media.vid{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px}
.media[draggable="true"]{cursor:grab}
.media.dragging{opacity:.4}
.sec-right.drag-over{outline:2px dashed var(--primary);outline-offset:2px;border-radius:12px}
.add-sec{margin-top:10px;width:100%;padding:16px;border:2px dashed var(--border);background:transparent;color:var(--sub);border-radius:16px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.add-sec:hover{background:var(--hover)}
.place-banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--ob));z-index:150;background:var(--primary);color:#fff;padding:10px 18px;border-radius:999px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:94vw;font-size:calc(14px*var(--fz))}
.place-banner .btn{background:#fff;color:#111;padding:4px 14px}

/* ===== 履歴 / ブックマーク / 設定 ===== */
.h-group{margin-bottom:22px}
.h-date{display:flex;align-items:center;gap:10px;font-weight:700;font-size:calc(17px*var(--fz));padding:6px 0;border-bottom:2px solid var(--border)}
.h-group ul,.bm-list,.ver-list{list-style:none;margin:0;padding:0}
.h-item{display:flex;align-items:center;gap:6px;padding:2px 0;min-width:0}
.h-item .icon-btn.star{width:34px;height:34px}
.h-word{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:8px 6px;border-radius:8px;text-align:left;text-decoration:none;color:var(--text);min-width:0;max-width:calc(100% - 44px)}
.h-word:hover{background:var(--hover)}
.h-word svg{color:var(--sub);flex:none}
.h-word>span:not(.bs){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.h-word .bs svg{color:#f59e0b}
.bs{display:inline-grid;flex:none}
.ver-list .h-word{max-width:100%}
.ver-badge{font-size:calc(12px*var(--fz));background:var(--primary);color:#fff;border-radius:999px;padding:1px 8px;flex:none}
.chk{width:20px;height:20px;accent-color:#dc2626;cursor:pointer;flex:none}
.chk.blue{accent-color:var(--primary)}
.sort-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.sort-opt.on{border-color:var(--primary);color:var(--primary);font-weight:700}
.set-card{margin-bottom:16px}
.set-t{font-weight:700;margin-bottom:12px}
.theme-opts{display:flex;gap:12px;flex-wrap:wrap}
.theme-opt{display:flex;align-items:center;gap:10px;padding:14px 22px;border:2px solid var(--border);border-radius:14px;background:var(--card);cursor:pointer;font-size:calc(16px*var(--fz))}
.theme-opt.on{border-color:var(--primary)}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid #888;display:inline-block}
.sw.light{background:#fff}.sw.dark{background:#000}.sw.time{background:linear-gradient(90deg,#fff 50%,#000 50%)}.sw.img{background:linear-gradient(135deg,#60a5fa,#f59e0b)}
.chk-row{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;font-size:calc(16px*var(--fz))}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.hint{color:var(--sub);font-size:calc(13px*var(--fz));margin:14px 0 0}
.danger-zone{border:2px solid #dc2626}
.danger-zone .set-t{color:#dc2626}
.danger-zone p{margin:0 0 14px;color:var(--sub);font-size:calc(14px*var(--fz))}


/* ===== プレビュー ===== */
.prev-banner{position:sticky;top:calc(var(--ot) + 8px);z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;color:#b45309;border-color:#d97706}
/* ===== [[記事§目次]] の目次名が無いとき ===== */
.rich a .wl-sec-missing,.rich-view a .wl-sec-missing,.cap-rich a .wl-sec-missing,.figcap a .wl-sec-missing{color:#dc2626!important}
body.dark .rich a .wl-sec-missing,body.dark .rich-view a .wl-sec-missing,body.dark .cap-rich a .wl-sec-missing,body.dark .figcap a .wl-sec-missing{color:#f87171!important}
/* ===== ページバーの並び順（設定） ===== */
.mock-wrap{position:relative;margin:12px 0 8px}
.mock-bar{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:60px}
.mock-bar.v{flex-direction:column;align-items:stretch;flex-wrap:nowrap;width:220px;max-width:100%}
.mi{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:40px;min-height:40px;padding:4px 8px;border-radius:10px;border:1px dashed transparent;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--text);background:var(--card)}
.mi:hover{background:var(--hover)}
.mi.sel{border-color:var(--primary)}
.mi.dragging{z-index:5;cursor:grabbing;box-shadow:var(--shadow)}
.mi .bl{font-size:calc(14px*var(--fz))}
.mock-bar.v .bl{display:inline}
.mock-bar.v .mi{justify-content:flex-start}
.mi-x{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:#dc2626;color:#fff;border:0;display:none;place-items:center;cursor:pointer;padding:0;z-index:6}
.mi.sel .mi-x{display:grid}
.mi-search{display:flex;align-items:center;gap:6px;background:var(--input);border:1px solid var(--border);border-radius:999px;padding:6px 14px;color:var(--sub);font-size:calc(13px*var(--fz));min-width:150px;pointer-events:none}
.mi .logo-crop{width:96px;pointer-events:none}
.mock-plus{position:absolute;top:-14px;right:-14px;width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);padding:0}
.mock-menu{margin:14px 0 0;border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px}
.mock-menu button{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);background:var(--card);border-radius:10px;cursor:pointer;color:var(--text)}
.mock-menu button:hover{background:var(--hover)}


/* ===== 追加ボタン（空白）／常に表示される追加メニュー ===== */
.mi-space{border:1px dashed var(--sub);border-radius:6px;padding:2px 12px;color:var(--sub);font-size:calc(12px*var(--fz))}
/* ===== 書き出し・共有の記事選択 ===== */
.modal-box.wide{width:min(560px,94vw);max-height:86vh;display:flex;flex-direction:column}
.sel-list{overflow:auto;flex:1;min-height:0;border:1px solid var(--border);border-radius:10px}
.sel-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer}
.sel-row:last-child{border-bottom:0}
.sel-row:hover{background:var(--hover)}
.sel-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.col-btns{display:flex;flex-direction:column;gap:10px}
.col-btns .btn{width:100%;padding:12px}
/* ===== 文字変更／検索と置き換えのパネル ===== */
.float-panel{position:fixed;z-index:120;top:calc(var(--ot) + var(--sh) + 8px);right:calc(12px + var(--or));width:min(340px,calc(100vw - 24px));max-height:calc(100vh - var(--ot) - var(--sh) - 24px);overflow:auto;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:16px 16px 14px}
.float-panel .modal-x{position:absolute;top:6px;right:6px}
.float-panel .row{flex-wrap:wrap}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.swatch{aspect-ratio:1;border-radius:50%;border:2px solid var(--border);cursor:pointer;padding:0}
.swatch:hover{transform:scale(1.12);border-color:var(--text)}
.color-pick{width:42px;height:38px;padding:0;border:1px solid var(--border);border-radius:8px;background:none;cursor:pointer;flex:none}
::highlight(find-all){background:rgba(250,204,21,.45);color:inherit}
::highlight(find-cur){background:#fb923c;color:#000}
@media(max-width:820px){.float-panel{left:8px;right:8px;width:auto}}


/* ===== 追加・ドラッグ関連 ===== */
.bar-toggle{touch-action:none}
.bar-toggle.dragging{transition:none}
.mock-menu button{touch-action:none;user-select:none;-webkit-user-select:none}
.mi-ph{min-width:40px;min-height:40px;border:2px dashed var(--primary);border-radius:10px}
.drag-ghost{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--primary);background:var(--card);border-radius:10px;color:var(--text);box-shadow:var(--shadow)}
.btn.gray{background:#9ca3af;color:#111;border-color:#9ca3af}
.btn.gray:hover:not(:disabled){background:#9ca3af}
body.dark .btn.gray,body.dark .btn.gray:hover:not(:disabled){background:#6b7280;color:#fff;border-color:#6b7280}
.warn-btn{color:#dc2626;border-color:#dc2626}
.float-panel.vf{top:calc(var(--ot) + 8px)}
/* ===== 設定の並び替え ===== */
.set-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.set-card{position:relative}
.drag-h{display:none;position:absolute;top:14px;right:14px;cursor:grab;touch-action:none;padding:6px;border-radius:8px;color:var(--sub);line-height:0}
.drag-h:hover{background:var(--hover)}
.page.reorder .drag-h{display:block}
.page.reorder .set-card>*:not(:first-child):not(.drag-h){display:none}
.page.reorder .set-card .set-t{margin-bottom:0}
.set-card.dragging{z-index:5;box-shadow:var(--shadow);opacity:.92;cursor:grabbing}
/* ===== ゴミ箱 ===== */
.trash-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--border)}
.trash-row .tr-t{flex:1 1 200px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.trash-row .tr-d{color:var(--sub);font-size:calc(13px*var(--fz))}
/* ===== 分割表示 ===== */
.split-wrap{display:flex;flex-direction:column;height:calc(100vh - var(--ot) - var(--ob));height:calc(100dvh - var(--ot) - var(--ob));padding:8px 10px 10px}
.split-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.split-bar .grow{flex:1}
.split-panes{flex:1;display:flex;gap:8px;min-height:0}
.split-pane{flex:1 1 0;display:flex;flex-direction:column;min-width:0;min-height:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.split-tools{display:flex;gap:6px;align-items:center;padding:6px;border-bottom:1px solid var(--border)}
.split-tools select{flex:1;min-width:0;padding:5px 6px;border:1px solid var(--border);background:var(--input);border-radius:8px;color:var(--text)}
.split-frame{flex:1;width:100%;border:0;background:var(--bg)}
.add-row{display:flex;gap:10px;flex-wrap:wrap}
.add-row .add-sec{flex:1 1 140px}
body.pane #header,body.pane #barToggle{display:none!important}
@media(max-width:700px){.split-panes{flex-direction:column}}


/* ===== ページバーの大きさ（端をドラッグ）／スケール ===== */
#header .icon-btn{width:calc(var(--ib) * var(--bsc));height:calc(var(--ib) * var(--bsc))}
#header .icon-btn svg{width:calc(22px * var(--bsc));height:calc(22px * var(--bsc))}
#header .tab-btn{width:calc(34px * var(--bsc));height:calc(34px * var(--bsc))}
#header .logo .logo-crop{width:min(calc(var(--logo-h) * 3 * var(--bsc)),42vw)}
#header .search-box{height:calc(var(--sbh) * var(--bsc))}
#header .bar-gap{width:calc(28px * var(--bsc))}
#header.bar-v .bar-gap{width:100%;height:calc(18px * var(--bsc))}
#header.bar-h{padding-top:calc(6px * var(--bsc));padding-bottom:calc(6px * var(--bsc));min-height:calc(56px * var(--bsc))}
#header.bar-v .icon-btn,#header.bar-v .tab-link{width:100%;height:auto;min-height:calc(40px * var(--bsc))}
#header.bar-v .logo,#header.bar-v .logo .logo-crop{width:100%}
.bar-resize{position:absolute;z-index:3;touch-action:none}
.bar-resize:hover,.bar-resize.on{background:var(--primary);opacity:.4}
body.bar-top .bar-resize{left:0;right:0;bottom:-6px;height:12px;cursor:ns-resize}
body.bar-bottom .bar-resize{left:0;right:0;top:-6px;height:12px;cursor:ns-resize}
body.bar-left .bar-resize{top:0;bottom:0;right:-6px;width:12px;cursor:ew-resize}
body.bar-right .bar-resize{top:0;bottom:0;left:-6px;width:12px;cursor:ew-resize}
/* ===== 編集バー（記号だけのボタン）・閲覧の虫眼鏡・プレビューのテロップ ===== */
.tb.ico{padding:6px 10px}
.tb.primary-tb{background:var(--primary);color:#fff;border-color:transparent}
.tb.primary-tb:hover:not(:disabled){background:var(--primary);filter:brightness(1.08)}
.tb.warn-btn{color:#dc2626;border-color:#dc2626}
.vf-btn{position:fixed;left:calc(18px + var(--ol));bottom:calc(18px + var(--ob));z-index:120;width:46px;height:46px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}
.telop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--ob));z-index:130;background:#b45309;color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:92vw;font-size:calc(14px*var(--fz));font-weight:700}
.telop .btn{background:#fff;color:#111;padding:4px 14px}
.mock-menu.del-target{border-color:#dc2626;background:rgba(220,38,38,.08)}
.art-row .h-word{flex:1 1 auto;max-width:none}

/* ===== モーダル / トースト ===== */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:300;padding:12px}
.modal-back.lb{background:rgba(0,0,0,.92);padding:0}
.modal-box{position:relative;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:18px;padding:24px;width:min(440px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal-box.square{min-height:min(440px,80vw);display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding-top:50px}
.modal-box .modal-x{position:absolute;top:8px;right:8px}
.modal-box h3{margin:0 0 8px;padding-right:34px}
.modal-box p{margin:0 0 18px;color:var(--sub)}
.modal-box p.warn{color:#dc2626;font-weight:700}
.lb-box{display:grid;place-items:center}
.lb-box img{max-width:96vw;max-height:94vh;display:block;border-radius:6px;cursor:zoom-out;touch-action:pinch-zoom}
.lb-box .modal-x{position:fixed;top:12px;right:12px;color:#fff;background:rgba(255,255,255,.18);z-index:2}
.row{display:flex;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.u-res{margin-top:8px;max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.u-item{text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--link)}
.u-item:hover{background:var(--hover)}
.u-none{color:var(--sub);padding:8px 10px;font-size:calc(14px*var(--fz))}
.color-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:auto 0}
.color-btn{padding:18px 0;border-radius:12px;border:1px solid #555;font-size:calc(18px*var(--fz));font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--ob));transform:translate(-50%,20px);background:#374151;color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:400;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.snack{position:fixed;left:50%;bottom:calc(28px + var(--ob));transform:translate(-50%,20px);background:#000;color:#fff;border:1px solid #444;border-radius:8px;padding:12px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;opacity:0;pointer-events:none;transition:.25s;z-index:410;width:max-content;max-width:min(92vw,520px);box-shadow:0 4px 20px rgba(0,0,0,.4);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.snack span{flex:1 1 auto;min-width:0;overflow-wrap:anywhere;line-height:1.5}
.snack.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.snack button{flex:none;background:none;border:0;color:#7db3ff;font-weight:700;cursor:pointer;padding:2px 4px;white-space:nowrap}
.snack button:hover{text-decoration:underline}

/* ===== 画面が狭いとき：ホームの履歴/ブックマークは縦に並べる ===== */
@media(max-width:1100px){
  .home-grid,.home-grid.two{grid-template-columns:1fr;gap:16px;padding:0 14px 30px}
  .home-grid>div:empty{display:none}
  .home-top{order:1}
  .home-side.left{order:2}
  .home-side.right{order:3}
  .home-side{max-width:none;max-height:none;justify-self:stretch}
}

/* ===== ページバー：画面が狭いときは検索バーを2段目に ===== */
@media(max-width:1000px){
  #header.bar-h .bar-search{order:99;flex:1 1 100%;width:auto;max-width:none}
  #header.bar-h .bar-grp{flex:1 1 auto}
  #header.bar-h .bar-grp.post{flex:0 0 auto}
}
/* ===== スマホ用レイアウト ===== */
@media(max-width:820px){
  :root{--sh:50px;--logo-h:38px;--bw:200px;--ib:36px;--sbh:38px}
  #header.bar-h{padding:6px 10px;gap:4px}
  .icon-btn{width:36px;height:36px}
  .search-box{height:38px}
  .s-input,.search-wrap.big .s-input{font-size:max(16px,calc(16px*var(--fz)))}
  .sec-grid,.v-grid{grid-template-columns:1fr}
  .art-wrap{grid-template-columns:1fr;gap:16px}
  .toc{position:static}
  .subbar{justify-content:flex-start}
  .h1{font-size:calc(22px*var(--fz))}
  .page{padding:18px 14px 90px}
  .title-input,.sec-heading,.m-input{font-size:max(16px,calc(16px*var(--fz)))}
  .title-input{font-size:max(18px,calc(18px*var(--fz)))}
  .rich,.cap-rich{font-size:max(16px,calc(16px*var(--fz)))}
  .theme-opt{padding:12px 16px}
  .r-row{flex-wrap:wrap}
  .btn{padding:8px 14px}
  .theme-opts{gap:8px}
  .modal-box{padding:20px}
  .modal-box.square{padding-top:50px}
  .set-head .h1{flex:1 1 auto}
}
</style>
</head>
<body>

<header id="header" class="bar-h"></header>
<button type="button" id="barToggle" class="bar-toggle" hidden aria-label="ページバーを開閉"></button>

<div id="subbar" class="subbar" hidden></div>
<main id="view"></main>
<div id="placeBanner" class="place-banner" hidden></div>
<div id="toast" class="toast"></div>
<div id="snack" class="snack"></div>
<button type="button" id="vfBtn" class="icon-btn vf-btn" title="ページ内を検索 (Ctrl+H)" aria-label="ページ内を検索" hidden></button>
<div id="prevTelop" class="telop" hidden><span>この記事は保存されていません</span><button type="button" class="btn">戻る</button></div>
<button type="button" id="toTopBtn" class="icon-btn totop" title="ページ上部へ戻る" aria-label="上部へ戻る" hidden></button>

<script>
'use strict';
/* ================= 画像ファイルの場所（ここだけ書き換えればOK） =================
   同じフォルダなら ファイル名だけ、サブフォルダなら 'images/YUpedia.png' のように、
   Web上に置く場合は 'https://…/YUpedia.png' のように指定できます。
   ファイルが見つからないときは、
     ① 設定の「ロゴ・アイコン画像」で選んでブラウザに保存した画像
     ② 内蔵の文字ロゴ（YUpedia）／内蔵アイコン
   の順に自動で切り替わります。HTMLの中に画像データを入れる必要はありません。 */

const ASSETS={logo:'https://pbs.twimg.com/media/HTqfVk6aIAAx-y_?format=png&name=small',icon:'https://pbs.twimg.com/media/HTqfmlzb0AAxvSt?format=png&name=360x360'};

const FALLBACK_ICON='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1e7bc9"/><text x="32" y="43" font-size="30" font-weight="700" text-anchor="middle" fill="#fff" font-family="sans-serif">YU</text></svg>');
/* ブラウザに保存した画像（背景 bg／ロゴ logo／アイコン icon） */
let assets={bg:null,logo:null,icon:null};

/* ================= ユーティリティ ================= */

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hl=(t,q)=>{
  t=String(t==null?'':t);if(!q)return esc(t);
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  let out='',last=0,m;
  while((m=re.exec(t))){if(!m[0]){re.lastIndex++;continue}out+=esc(t.slice(last,m.index))+'<b>'+esc(m[0])+'</b>';last=m.index+m[0].length}
  return out+esc(t.slice(last));
};

/* 黒い四角のお知らせ（右側にキャンセル付き） */
let snackTimer,snackAct=null;
function snack(msg,label,fn){
  const s=$('#snack');
  s.innerHTML='<span></span><button type="button"></button>';
  $('span',s).textContent=msg;
  const b=$('button',s);b.textContent=label;
  snackAct=fn;
  b.onclick=()=>{s.classList.remove('on');clearTimeout(snackTimer);const f=snackAct;snackAct=null;if(f)f()};
  s.classList.add('on');clearTimeout(snackTimer);
  snackTimer=setTimeout(()=>{s.classList.remove('on');snackAct=null},6000);
}
/* 左右にドラッグ（スワイプ）すると、すぐ消える */
(function(){
  const s=$('#snack');let st=null;
  s.addEventListener('pointerdown',e=>{
    if(!s.classList.contains('on')||e.target.closest('button'))return;
    st={pid:e.pointerId,x:e.clientX,dx:0,moved:false};
  });
  s.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.pid)return;
    st.dx=e.clientX-st.x;
    if(!st.moved&&Math.abs(st.dx)>6){st.moved=true;try{s.setPointerCapture(e.pointerId)}catch{}s.style.transition='none';clearTimeout(snackTimer)}
    if(st.moved){s.style.transform='translate(calc(-50% + '+st.dx+'px),0)';s.style.opacity=String(Math.max(.2,1-Math.abs(st.dx)/300))}
  });
  const end=e=>{
    if(!st||e.pointerId!==st.pid)return;
    const d=st;st=null;if(!d.moved)return;
    s.style.transition='';
    if(Math.abs(d.dx)>70){
      s.style.transform='translate(calc(-50% + '+(d.dx>0?'120vw':'-120vw')+'),0)';s.style.opacity='0';
      setTimeout(()=>{s.classList.remove('on');s.style.transform='';s.style.opacity='';snackAct=null},250);
    }else{
      s.style.transform='';s.style.opacity='';
      snackTimer=setTimeout(()=>{s.classList.remove('on');snackAct=null},3500);
    }
  };
  s.addEventListener('pointerup',end);s.addEventListener('pointercancel',end);
})();

function textOf(html){return (new DOMParser().parseFromString('<body>'+html,'text/html').body.textContent||'').replace(/\s+/g,' ').trim()}
function sanitize(html){
  const doc=new DOMParser().parseFromString('<body>'+(html||''),'text/html');
  doc.body.querySelectorAll('script,iframe,object,embed,style,link,meta').forEach(n=>n.remove());
  doc.body.querySelectorAll('*').forEach(n=>{[...n.attributes].forEach(at=>{
    const nm=at.name.toLowerCase();
    if(nm.startsWith('on'))n.removeAttribute(at.name);
    else if((nm==='href'||nm==='src')&&/^\s*javascript:/i.test(at.value))n.removeAttribute(at.name);
  })});
  return doc.body.innerHTML;
}

/* 画像ファイルを読み込む（maxSide>0なら大きい画像を縮小） */
function readImage(file,maxSide){
  return new Promise((ok,ng)=>{
    const fr=new FileReader();
    fr.onerror=()=>ng(fr.error);
    fr.onload=()=>{
      if(!maxSide)return ok(fr.result);
      const im=new Image();
      im.onerror=()=>ng(new Error('image'));
      im.onload=()=>{
        const r=Math.min(1,maxSide/Math.max(im.naturalWidth,im.naturalHeight));
        if(r>=1&&file.size<2*1024*1024)return ok(fr.result);
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.naturalWidth*r));c.height=Math.max(1,Math.round(im.naturalHeight*r));
        const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
        try{ok(c.toDataURL('image/jpeg',.88))}catch{ok(fr.result)}
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const applyTheme=()=>{
  const b=document.body;CUSTOM_VARS.forEach(v=>b.style.removeProperty(v));

  if(settings.theme==='custom'&&normHex(settings.customBg)){
    const c=hexRgb(settings.customBg),W=[255,255,255],K=[0,0,0];
    dark=(0.299*c[0]+0.587*c[1]+0.114*c[2])/255<0.5;
    b.style.setProperty('--bg',rgbHex(c));
    b.style.setProperty('--card',rgbHex(dark?mixRgb(c,W,.07):mixRgb(c,W,.55)));
    b.style.setProperty('--input',rgbHex(dark?mixRgb(c,W,.12):mixRgb(c,W,.3)));
    b.style.setProperty('--border',rgbHex(dark?mixRgb(c,W,.22):mixRgb(c,K,.14)));
  }else dark=settings.theme==='dark'||(settings.theme==='time'&&isNight());
  b.classList.toggle('dark',dark);
};

const DB={

    const q=indexedDB.open('mywiki',3);
    q.onupgradeneeded=()=>{
      const d=q.result;
      if(!d.objectStoreNames.contains('articles'))d.createObjectStore('articles',{keyPath:'id'});

  })},
  tx(mode,fn,store='articles'){return new Promise((ok,ng)=>{
    if(!this.db)return ok(undefined);
    const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));
    t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>ng(t.error);t.onabort=()=>ng(t.error);
  })},
  all(){return this.tx('readonly',s=>s.getAll())},

  clear(){return this.tx('readwrite',s=>{s.clear()})},
  replaceAll(list){return this.tx('readwrite',s=>{s.clear();list.forEach(a=>s.put(a))})},

};

/* all=false：検索バーの候補用（候補から消したものは除く）／ all=true：履歴ページと同じ内容 */
function recentWords(n,all){
  const seen=new Set(),out=[];
  for(const h of [...hist].sort((a,b)=>b.t-a.t)){
    if(seen.has(h.w))continue;
    seen.add(h.w);
    if(!all&&h.hd)continue;
    out.push(h.w);if(out.length>=n)break;
  }
  return out;
}

const SORTS=[['added','追加順'],['title','見出し順'],['opened','最近開いた順番']];
function sortedBM(){
  const list=bms.map(b=>({b,a:getAny(b.id)})).filter(x=>x.a);
  const m=settings.bmSort||'added';
  if(m==='title')list.sort((x,y)=>collator.compare(x.a.title,y.a.title));
  else if(m==='opened')list.sort((x,y)=>(opened[y.a.id]||0)-(opened[x.a.id]||0)||y.b.t-x.b.t);
  else list.sort((x,y)=>y.b.t-x.b.t);
  return list;
}

/* ================= モーダル ================= */
let modal=null;
function openModal(node,onClose,cls){
  closeModal();
  const back=document.createElement('div');back.className='modal-back'+(cls?' '+cls:'');back.appendChild(node);document.body.appendChild(back);
  const onKey=e=>{if(e.key==='Escape')close()};
  const close=()=>{if(!modal||modal.back!==back)return;modal=null;back.remove();document.removeEventListener('keydown',onKey);if(onClose)onClose()};
  modal={back,close};
  back.addEventListener('mousedown',e=>{if(e.target===back)close()});
  document.addEventListener('keydown',onKey);
  const x=node.querySelector('.modal-x');if(x)x.addEventListener('click',close);
  return close;
}
function closeModal(){if(modal)modal.close()}
/* 戻り値：true=OK側 / false=もう一方のボタン / null=閉じただけ */
function confirmDialog({title,message,okText='OK',cancelText='キャンセル',danger=false,warn=false,okFirst=false}){
  return new Promise(res=>{
    const box=document.createElement('div');box.className='modal-box';
    const okB=`<button class="btn ${danger?'danger':'primary'}" data-r="1">${esc(okText)}</button>`;
    const ngB=`<button class="btn" data-r="0">${esc(cancelText)}</button>`;
    box.innerHTML=`<h3>${esc(title)}</h3><p class="${warn?'warn':''}">${esc(message)}</p><div class="row end">${okFirst?okB+ngB:ngB+okB}</div>`;
    let done=false;
    const close=openModal(box,()=>{if(!done){done=true;res(null)}});
    box.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(!b)return;done=true;close();res(b.dataset.r==='1')});
  });
}

function buildSearch(big){
  const el=document.createElement('div');el.className='search-wrap'+(big?' big':'');
  el.innerHTML=`<div class="search-box"><button type="button" class="s-btn" title="検索">${ic('search')}</button><input class="s-input" type="text" placeholder="YUpediaを検索" autocomplete="off" enterkeyhint="search"><div class="s-dd" hidden></div></div>`;
  const input=$('.s-input',el),dd=$('.s-dd',el);
  let sel=-1;
  const rows=()=>$$('.dd-row',dd);
  const setSel=i=>{const r=rows();r.forEach((x,k)=>x.classList.toggle('sel',k===i));sel=i;if(r[i]&&r[i].scrollIntoView)r[i].scrollIntoView({block:'nearest'})};
  /* 文字が入力されている間は検索結果（最大3件）、空のときは検索履歴（最大5件） */
  const renderDD=()=>{
    sel=-1;
    const q=input.value.trim();
    if(q){
      const res=searchArticles(q).slice(0,8);
      dd.innerHTML=res.length
        ?res.map(r=>`<div class="dd-row" data-a="${r.a.id}"><span class="dd-w">${hl(r.a.title,q)}</span></div>`).join('')
        :'<div class="dd-none">検索結果なし</div>';
      dd.hidden=false;return;
    }
    const items=recentWords(5);
    if(!items.length){dd.hidden=true;return}
    dd.innerHTML=items.map(w=>`<div class="dd-row" data-w="${esc(w)}"><span class="dd-w">${esc(w)}</span><button type="button" class="dd-x" title="候補から削除（履歴ページには残ります）">${ic('x',16)}</button></div>`).join('');
    dd.hidden=false;
  };
  dd.addEventListener('click',e=>{
    const row=e.target.closest('.dd-row');if(!row)return;
    if(row.dataset.a){
      const a=getArticle(row.dataset.a);if(!a)return;
      dd.hidden=true;addHistory(a.title);navigate('#/article/'+a.id);return;
    }
    const w=row.dataset.w;
    if(e.target.closest('.dd-x')){removeWord(w);renderDD();input.focus()}
    else{input.value=w;dd.hidden=true;doSearch(w)}
  });
  input.addEventListener('focus',renderDD);
  input.addEventListener('click',renderDD);
  input.addEventListener('input',renderDD);
  input.addEventListener('keydown',e=>{
    if(e.isComposing||e.keyCode===229)return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      if(dd.hidden)renderDD();
      const n=rows().length;if(!n)return;
      e.preventDefault();
      setSel(e.key==='ArrowDown'?(sel+1)%n:(sel<=0?n-1:sel-1));
    }else if(e.key==='Enter'){
      e.preventDefault();
      if(sel>=0&&rows()[sel]){rows()[sel].click();return}
      if(!input.value.trim())return;   // 何も入力していないときは何も起こらない
      dd.hidden=true;doSearch(input.value);
    }else if(e.key==='Escape')dd.hidden=true;
  });
  $('.s-btn',el).addEventListener('click',()=>{dd.hidden=true;doSearch(input.value)});
  return {el,input,dd};
}
document.addEventListener('click',e=>{
  const path=e.composedPath();
  $$('.search-wrap').forEach(w=>{if(!path.includes(w))$('.s-dd',w).hidden=true});
});
function doSearch(q){
  q=(q||'').trim();
  if(!q)return;
  addHistory(q);
  navigate('#/search/'+encodeURIComponent(q));
}
function openHistoryWord(w){
  addHistory(w);
  const a=state.articles.find(x=>x.title===w);
  navigate(a?'#/article/'+a.id:'#/search/'+encodeURIComponent(w));
}
/* 検索結果の並び：①見出しが一致（完全→前方→部分）②目次名に一致 ③本文に一致。同じ段階では、ブックマーク済み→一致が多い順→最近開いた順→見出し順 */
function searchArticles(q){
  const k=q.toLowerCase(),out=[];
  for(const a of state.articles){
    const t=a.title.toLowerCase();let tier=99,snippet='';
    if(t===k)tier=0;else if(t.startsWith(k))tier=1;else if(t.includes(k))tier=2;
    if(tier>2&&a.sections.some(s=>s.heading.toLowerCase().includes(k)))tier=3;
    const body=a.sections.map(s=>textOf(s.html)).join(' '),bl=body.toLowerCase();
    let hits=0,i=0;
    while((i=bl.indexOf(k,i))>=0){hits++;i+=k.length}
    const bi=bl.indexOf(k);
    if(bi>=0){if(tier>4)tier=4;snippet=(bi>30?'…':'')+body.slice(Math.max(0,bi-30),bi+90)+(body.length>bi+90?'…':'')}
    if(tier<99)out.push({a,score:tier,snippet,hits,bm:isBM(a.id)?1:0});
  }
  return out.sort((x,y)=>x.score-y.score||y.bm-x.bm||y.hits-x.hits||(opened[y.a.id]||0)-(opened[x.a.id]||0)||collator.compare(x.a.title,y.a.title));
}

/* ================= ルーティング（戻る／進む対応） ================= */
let lastHash=location.hash||'#/',guardSkip=false,curDepth=0,maxDepth=0,pendingReplace=false;
let titleBase='YUpedia';
const siteName=()=>String(settings.siteName||'').trim()||'YUpedia';
function applyTitle(){const n=siteName();document.title=(titleBase==='YUpedia')?n:titleBase.replace(/ -YUpedia$/,' -'+n)}
const setTitle=t=>{titleBase=t;applyTitle()};
/* 編集中に未保存の変更があるまま移動しようとしたら確認する */
const askLeave=(dirty=true)=>confirmDialog({
  title:'編集を終了しますか？',
  message:dirty?'保存されていない変更があります。このまま移動すると、編集中の内容は失われます。（Ctrl+Sで一時保存した内容は、次回の編集時に復元できます）':'このページの編集をやめて移動しますか？',
  okText:'移動する',cancelText:'編集を続ける',danger:true,warn:dirty});
function navigate(h,replace){
  if(ed&&isDirty()){
    askLeave(true).then(ok=>{if(ok===true&&ed){ed.leaving=true;go(h,replace)}});
    return;
  }
  go(h,replace);
}
function go(h,replace){
  if((location.hash||'#/')===h){route();return}
  if(replace){pendingReplace=true;location.replace(h)}else location.hash=h;
}
function updateNav(){
  $$('[data-bar="back"]').forEach(b=>b.disabled=curDepth<=0);
  $$('[data-bar="fwd"]').forEach(f=>f.disabled=curDepth>=maxDepth);
}
window.addEventListener('hashchange',()=>{
  const rep=pendingReplace;pendingReplace=false;
  const st=history.state;
  const d=rep?curDepth:(st&&typeof st.d==='number'?st.d:curDepth+1);
  try{history.replaceState({d},'')}catch{}
  if(guardSkip){guardSkip=false;updateNav();return}
  if(isDirty()&&!confirm('保存されていない変更があります。破棄して移動しますか？')){guardSkip=true;pendingReplace=true;location.replace(lastHash);return}
  curDepth=d;if(curDepth>maxDepth)maxDepth=curDepth;lastHash=location.hash||'#/';updateNav();
  route();
});
window.addEventListener('beforeunload',e=>{if(isDirty()){e.preventDefault();e.returnValue=''}});
/* 編集画面から出るリンク（ヘッダーなど）を押したときの確認 */
document.addEventListener('click',e=>{
  if(!ed||ed.leaving)return;
  const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
  const href=a.getAttribute('href');
  if(!href||!href.startsWith('#/'))return;
  if(a.closest('#editor .rich,#editor .cap-rich'))return;
  if(!isDirty())return;
  e.preventDefault();e.stopPropagation();
  askLeave(true).then(ok=>{if(ok===true&&ed){ed.leaving=true;go(href)}});
},true);

let isArticlePage=false;

/* ================= タブ ================= */
const saveTabs=()=>{LS.set('mywiki.tabs',tabs);LS.set('mywiki.activeTab',activeTab);updateTabBtn()};
function updateTabBtn(){$$('.tab-count').forEach(b=>{b.textContent=tabs.length>99?'99+':String(tabs.length)})}
/* いま開いているページを、選択中のタブに記録する（タブが無ければ作る） */
function trackTab(h){
  let t=tabs.find(x=>x.id===activeTab);
  if(!t){t={id:uid(),h};tabs.push(t);activeTab=t.id}
  t.h=h;saveTabs();
}
function pageName(h){
  const seg=String(h||'#/').replace(/^#\/?/,'').split('/');
  const p=seg[0]||'home';
  let arg=seg.slice(1).join('/');try{arg=decodeURIComponent(arg)}catch{}
  switch(p){
    case 'article':{const a=getArticle(arg.split('/')[0]);return a?a.title:'記事'}
    case 'edit':{const a=getArticle(arg);return a?a.title+'（編集）':'編集'}
    case 'new':return arg?arg+'（作成）':'ページ作成';
    case 'search':return '検索：'+arg;
    case 'versions':case 'version':{const a=getArticle(arg.split('/')[0]);return a?a.title+'（編集履歴）':'編集履歴'}
    case 'guide':return 'YUpediaの使い方';
    case 'history':return '履歴';
    case 'trash':return 'ゴミ箱';
    case 'share':return '共有';
    case 'articles':return 'すべての記事';
    case 'split':return '分割表示';
    case 'bookmarks':return 'ブックマーク';
    case 'settings':return '設定';
    default:return 'ホーム';
  }
}
function renderTabs(){
  setTitle('タブ -YUpedia');
  const rows=tabs.map(t=>{const n=pageName(t.h);
    return `<li class="tab-row${t.id===activeTab?' on':''}"><button type="button" class="tab-name" data-act="tab-open" data-id="${t.id}" title="${esc(n)}">${esc(n)}</button><button type="button" class="icon-btn danger" data-act="tab-del" data-id="${t.id}" title="このタブを削除">${ic('trash',20)}</button></li>`}).join('');
  $('#view').innerHTML=`<div class="page"><div class="page-head"><h1 class="h1">タブ</h1><div class="head-btns"><button type="button" class="btn danger" data-act="tab-del-all" ${tabs.length?'':'disabled'}>すべて削除</button><button type="button" class="btn primary" data-act="tab-add">新しく追加</button><button type="button" class="btn" data-act="split-open">分割表示</button></div></div>${
    tabs.length?`<ul class="tab-list">${rows}</ul>`:'<div class="empty" style="padding:30px 0">タブはありません</div>'}<div class="add-row"><button type="button" class="add-sec" data-act="tab-add">${ic('plus',20)} 新しく追加</button><button type="button" class="add-sec" data-act="split-open">分割表示</button></div></div>`;
}
const onTabsPage=()=>(location.hash||'')==='#/tabs';
function tabOpen(id){const t=tabs.find(x=>x.id===id);if(!t)return;activeTab=t.id;saveTabs();navigate(t.h||'#/')}
function tabAdd(){
  const t={id:uid(),h:'#/'};tabs.push(t);activeTab=t.id;saveTabs();renderTabs();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function tabDel(id){
  const i=tabs.findIndex(x=>x.id===id);if(i<0)return;
  const t=tabs[i],wasActive=(activeTab===id),name=pageName(t.h);
  tabs.splice(i,1);if(wasActive)activeTab=null;saveTabs();
  if(onTabsPage())renderTabs();
  snack(name+'を削除しました','キャンセル',()=>{
    if(!tabs.some(x=>x.id===t.id))tabs.splice(Math.min(i,tabs.length),0,t);
    if(wasActive&&!activeTab)activeTab=t.id;
    saveTabs();if(onTabsPage())renderTabs();
  });
}
function tabDelAll(){
  if(!tabs.length)return;
  const backup=tabs.slice(),prev=activeTab;
  tabs=[];activeTab=null;saveTabs();
  if(onTabsPage())renderTabs();
  snack('すべてのタブを削除しました','キャンセル',()=>{
    tabs=backup.concat(tabs);
    if(!activeTab)activeTab=prev;
    saveTabs();if(onTabsPage())renderTabs();
  });
}


/* ---------- ゴミ箱（削除した記事は30日間残り、復元できる） ---------- */
const TRASH_DAYS=30;
async function restoreFromTrash(id,bm){
  const a=state.trash.find(x=>x.id===id);if(!a)return;
  delete a.trashed;
  let t=a.title,k=1;
  while(state.articles.some(x=>x.title===t)){k++;t=a.title+'（'+k+'）'}
  a.title=t;
  try{await DB.put(a)}catch{a.trashed=Date.now();toast('復元に失敗しました');return}
  state.trash=state.trash.filter(x=>x.id!==id);state.articles.push(a);
  if(bm&&!isBM(id)){bms.push(bm);saveBM()}
  if((location.hash||'')==='#/trash')renderTrash();
  toast('「'+a.title+'」を復元しました');
}
function renderTrash(){
  setTitle('ゴミ箱 -YUpedia');
  const list=[...state.trash].sort((x,y)=>y.trashed-x.trashed);
  $('#view').innerHTML=`<div class="page"><div class="page-head"><h1 class="h1">ゴミ箱</h1>${list.length?'<button type="button" class="btn danger" data-act="trash-empty">ゴミ箱を空にする</button>':''}</div><p class="hint" style="margin:0 0 10px">削除した記事は${TRASH_DAYS}日間ここに残り、復元できます。</p>${
    list.length?list.map(a=>{const left=Math.max(0,TRASH_DAYS-Math.floor((Date.now()-a.trashed)/86400000));
      return `<div class="trash-row"><div class="tr-t">${esc(a.title)}<div class="tr-d">${esc(fmtDT(a.trashed))} に削除（あと${left}日で完全に削除）</div></div><button type="button" class="btn" data-act="trash-restore" data-id="${a.id}">復元</button><button type="button" class="btn warn-btn" data-act="trash-del" data-id="${a.id}">完全に削除</button></div>`}).join('')
    :'<div class="empty">ゴミ箱は空です</div>'}</div>`;
}
async function trashDelete(id){
  const a=state.trash.find(x=>x.id===id);if(!a)return;
  const ok=await confirmDialog({title:'完全に削除しますか？',message:'「'+a.title+'」を完全に削除します。この操作は元に戻せません。',okText:'完全に削除',danger:true});
  if(ok!==true)return;
  try{await DB.del(id)}catch{toast('削除に失敗しました');return}
  state.trash=state.trash.filter(x=>x.id!==id);renderTrash();toast('完全に削除しました');
}
async function trashEmpty(){
  if(!state.trash.length)return;
  const ok=await confirmDialog({title:'ゴミ箱を空にしますか？',message:state.trash.length+'件の記事を完全に削除します。この操作は元に戻せません。',okText:'空にする',danger:true});
  if(ok!==true)return;
  try{for(const a of state.trash)await DB.del(a.id)}catch{toast('削除に失敗しました');return}
  state.trash=[];renderTrash();toast('ゴミ箱を空にしました');
}

/* ---------- 記事表示（閲覧）：通常の記事・使い方・過去の版で共通 ---------- */
function renderNotFound(){setTitle('YUpedia');$('#view').innerHTML='<div class="page"><div class="empty">記事が見つかりません<br><a href="#/">ホームへ戻る</a></div></div>'}
const starBtn=(id,s=22)=>{const on=isBM(id);return `<button class="icon-btn star${on?' on':''}" data-act="bm-toggle" data-id="${id}" data-s="${s}" title="ブックマーク">${ic('star',s,on)}</button>`};
function articleHTML(a,o={}){
  const heads=a.sections.map((s,i)=>({s,i})).filter(x=>x.s.heading);
  const toc=heads.length>=2
    ?`<nav class="toc"><div class="toc-h"><span class="toc-t">目次</span><button type="button" class="toc-close" data-act="toc-toggle">閉じる</button></div><ol>${heads.map(x=>`<li><button class="toc-link" data-act="goto" data-i="${x.i}" title="${esc(x.s.heading)}">${esc(x.s.heading)}</button></li>`).join('')}</ol></nav>`:'';
  const secs=a.sections.map((s,i)=>{
    const has=s.media.length>0;
    const media=s.media.map(m=>{
      const cap=(m.caption&&textOf(m.caption))?`<div class="figcap">${sanitize(m.caption)}</div>`:'';
      if(!m.src)return `<div class="v-aud"><div class="fname">${esc(m.name)}</div><div class="figcap">（この版のファイルは保存されていません）</div></div>`;
      if(m.type==='image')return `<figure><img src="${esc(m.src)}" alt="" data-act="zoom">${cap}</figure>`;
      if(m.type==='video')return `<div class="v-vid"><div class="fname">${esc(m.name)}</div><video controls src="${esc(m.src)}"></video>${cap}</div>`;
      return `<div class="v-aud"><div class="fname">${esc(m.name)}</div><audio controls src="${esc(m.src)}"></audio>${cap}</div>`;
    }).join('');
    return `<section class="v-sec" id="sec-${i}">${s.heading?`<h2>${esc(s.heading)}</h2>`:''}<div class="v-grid${has?'':' full'}"><div class="rich-view">${sanitize(s.html)}</div>${has?`<div class="v-media">${media}</div>`:''}</div></section>`;
  }).join('');
  let tools='';
  if(o.guide)tools=starBtn('guide');
  else if(!o.ver&&!o.preview)tools=`<a class="icon-btn" href="#/edit/${a.id}" title="編集">${ic('pencil')}</a><button class="icon-btn danger" data-act="del-article" data-id="${a.id}" title="削除">${ic('trash')}</button><a class="icon-btn" href="#/versions/${a.id}" title="編集履歴">${ic('clock')}</a>${starBtn(a.id)}`;
  const banner=o.preview?'':o.ver?`<div class="ver-banner">${esc(fmtDT(o.ver.t))} 時点の版を表示しています。<a href="#/versions/${o.ver.id}">編集履歴へ戻る</a><a href="#/article/${o.ver.id}">最新の記事へ</a><button type="button" class="mini-btn" data-act="restore-version" data-id="${o.ver.id}" data-idx="${o.ver.idx}">復元する</button></div>`:'';
  const openBtn=toc?`<button type="button" class="mini-btn toc-open" data-act="toc-toggle">目次を開く</button>`:'';
  const closedCls=(!toc||!settings.tocOpen)?' toc-closed':'';
  return `<div class="page wide${closedCls}">${banner}<div class="art-head"><h1 class="h1">${esc(a.title)}</h1>${tools}${openBtn}</div><div class="art-wrap">${toc}<div class="art-body">${secs}</div></div></div>`;
}
/* [[記事名]]で作ったリンクを現在の記事の有無に合わせて設定（無い見出しは赤＋下線→作成画面へ） */
/* [[記事名]] / [[記事名§目次名]] のリンクを、いまの記事の有無に合わせて設定する */
function refreshWikiLink(a){
  const t=a.dataset.wt,ws=a.dataset.ws||'',art=findByTitle(t);
  a.classList.remove('wl-missing');a.removeAttribute('title');a.removeAttribute('target');
  let sp=null;
  if(ws){
    a.textContent='';
    a.appendChild(document.createTextNode(t+'§'));
    sp=document.createElement('span');sp.className='wl-sec';sp.textContent=ws;a.appendChild(sp);
  }
  if(art){
    a.href=ws?'#/article/'+art.id+'/sec/'+encodeURIComponent(ws):'#/article/'+art.id;
    a.dataset.hist=art.title;
    if(ws&&!art.sections.some(x=>(x.heading||'').trim()===ws)){sp.classList.add('wl-sec-missing');a.title='「'+art.title+'」に「'+ws+'」という目次はありません'}
  }else{
    a.href='#/new/'+encodeURIComponent(t);a.classList.add('wl-missing');
    a.title='この見出しの記事はまだありません（押すと作成できます）';a.removeAttribute('data-hist');
  }
}
function resolveWikiLinks(root,cur){
  $$('a[data-wt]',root).forEach(refreshWikiLink);
  $$('a[data-wiki]',root).forEach(a=>{const art=getArticle(a.dataset.wiki);if(art)a.dataset.hist=art.title});
  /* {{目次名}} のリンク：この記事内の目次に飛ぶ（無い目次は赤＋下線） */
  $$('a[data-toc]',root).forEach(a=>{
    const t=(a.dataset.toc||'').trim();
    const ok=!!(cur&&cur.sections.some(x=>(x.heading||'').trim()===t));
    a.href='#';a.removeAttribute('target');a.removeAttribute('data-hist');
    a.classList.toggle('wl-missing',!ok);
    if(ok)a.removeAttribute('title');else a.title='この記事に該当する目次がありません';
  });
}
function showArticle(a,o){$('#view').innerHTML=articleHTML(a,o);resolveWikiLinks($('#view'),a)}
function renderArticle(arg){
  /* 「ID」または「ID/sec/目次名」（記事の中の目次まで飛ぶ） */
  const mm=String(arg).match(/^([^/]*)(?:\/sec\/([\s\S]*))?$/);
  const id=mm?mm[1]:arg,secName=(mm&&mm[2])?mm[2].trim():'';
  const a=getArticle(id);if(!a)return renderNotFound();
  setTitle(a.title+' -YUpedia');
  opened[id]=Date.now();LS.set('mywiki.opened',opened);
  showArticle(a,{});
  if(secName)setTimeout(()=>{
    const el=$$('.v-sec').find(x=>{const h=$('h2',x);return h&&h.textContent.trim()===secName});
    if(el)el.scrollIntoView({block:'start'});
  },60);
}
async function deleteArticle(id){
  const a=getArticle(id);if(!a)return;
  a.trashed=Date.now();
  try{await DB.put(a)}catch{delete a.trashed;toast('削除に失敗しました');return}
  state.articles=state.articles.filter(x=>x.id!==id);state.trash.push(a);
  const oldBm=bms.find(b=>b.id===id);
  bms=bms.filter(b=>b.id!==id);saveBM();
  if((location.hash||'').startsWith('#/article/'))navigate('#/',true);else route();
  snack('「'+a.title+'」をゴミ箱に移動しました','キャンセル',()=>restoreFromTrash(id,oldBm));
}

/* ---------- 編集履歴（直近5回） ---------- */
const snapRec=(a,t)=>({t,title:a.title,tags:[...(a.tags||[])],sections:a.sections.map(s=>({sid:s.sid,heading:s.heading,html:s.html,media:s.media.map(m=>({mid:m.mid,type:m.type,name:m.name,caption:m.caption}))}))});
function buildVersions(old,rec){
  let vs=old&&Array.isArray(old.versions)?old.versions.map(v=>JSON.parse(JSON.stringify(v))):[];
  if(old&&!vs.length)vs.push(snapRec(old,old.updated||old.created||Date.now()));
  if(old){
    /* 現在の記事から消えるファイルは、それを使っていた過去の版へ移して残す */
    const keep=new Set(rec.sections.flatMap(s=>s.media.map(m=>m.mid)));
    const oldSrc={};old.sections.forEach(s=>s.media.forEach(m=>{oldSrc[m.mid]=m.src}));
    vs.forEach(v=>v.sections.forEach(s=>s.media.forEach(m=>{if(!m.src&&!keep.has(m.mid)&&oldSrc[m.mid])m.src=oldSrc[m.mid]})));
  }
  vs.push(snapRec(rec,rec.updated));
  return vs.slice(-5);
}
async function restoreVersion(id,idx){
  const a=getArticle(id);if(!a)return;
  const v=a.versions&&a.versions[idx];if(!v)return;
  const ok=await confirmDialog({title:'この版を復元しますか？',message:fmtDT(v.t)+' 時点の内容に戻します。現在の内容は新しい版として履歴に残ります。',okText:'復元する',cancelText:'キャンセル'});
  if(ok!==true)return;
  const curSrc={};a.sections.forEach(s=>s.media.forEach(m=>{curSrc[m.mid]=m.src}));
  const rec={id:a.id,title:v.title,tags:[...(v.tags||[])],created:a.created,updated:Date.now(),
    sections:v.sections.map(s=>({sid:s.sid,heading:s.heading,html:s.html,
      media:s.media.map(m=>({...m,src:m.src||curSrc[m.mid]||''}))}))};
  rec.versions=buildVersions(a,rec);
  try{await DB.put(rec)}catch{toast('復元に失敗しました');return}
  const i=state.articles.findIndex(x=>x.id===id);if(i>=0)state.articles[i]=rec;
  toast('復元しました');
  navigate('#/article/'+id,true);
}
function renderVersions(id){
  const a=getArticle(id);if(!a)return renderNotFound();
  setTitle(a.title+'の編集履歴 -YUpedia');
  const vs=a.versions||[];
  const items=[];
  for(let i=vs.length-1;i>=0&&items.length<5;i--){
    items.push(`<li class="h-item"><a class="h-word" href="#/version/${a.id}/${i}"><span>${esc(fmtDT(vs[i].t))}</span></a>${i===vs.length-1?'<span class="ver-badge">最新</span>':''}</li>`);
  }
  $('#view').innerHTML=`<div class="page"><div class="page-head"><h1 class="h1">編集履歴</h1><a class="btn" href="#/article/${a.id}">記事に戻る</a></div><p class="hint" style="margin:0 0 14px">「${esc(a.title)}」の直近5回分の保存です。日付を押すと、その時の版を見られます。</p>${
    items.length?`<ul class="ver-list">${items.join('')}</ul>`:'<div class="empty">編集履歴はありません<div class="hint">この記事を次に保存したときから記録されます。</div></div>'}</div>`;
}
function renderVersion(arg){
  const [id,nStr]=String(arg).split('/');
  const idx=+nStr;
  const a=getArticle(id);const v=a&&a.versions&&a.versions[idx];
  if(!a||!v)return renderNotFound();
  setTitle(v.title+'（'+fmtDT(v.t)+'の版） -YUpedia');
  const curSrc={};a.sections.forEach(s=>s.media.forEach(m=>{curSrc[m.mid]=m.src}));
  const pseudo={id:a.id,title:v.title,tags:v.tags||[],sections:v.sections.map(s=>({...s,media:s.media.map(m=>({...m,src:m.src||curSrc[m.mid]||''}))}))};
  showArticle(pseudo,{ver:{id:a.id,t:v.t,idx}});
}

function sortedArticlesBy(mode){
  const l=[...state.articles];
  if(mode==='opened')l.sort((a,b)=>(opened[b.id]||0)-(opened[a.id]||0)||collator.compare(a.title,b.title));
  else if(mode==='added')l.sort((a,b)=>(b.created||0)-(a.created||0));
  else l.sort((a,b)=>collator.compare(a.title,b.title));
  return l;
}

/* 縦に並んだ項目を、つまみのドラッグで並べ替える */
function initSortable(cont,o){
  let drag=null;
  cont.addEventListener('pointerdown',e=>{
    const h=e.target.closest(o.handle);if(!h)return;
    const it=h.closest(o.item);if(!it)return;
    const r=it.getBoundingClientRect();
    drag={it,gy:e.clientY-r.top,pid:e.pointerId};
    it.classList.add('dragging');try{cont.setPointerCapture(e.pointerId)}catch{}
    e.preventDefault();
  });
  cont.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.pid)return;
    e.preventDefault();
    const it=drag.it;it.style.transform='none';
    let best=null,bd=Infinity;
    for(const c of $$(o.item,cont)){
      if(c===it)continue;
      const r=c.getBoundingClientRect(),cy=r.top+r.height/2,d=Math.abs(e.clientY-cy);
      if(d<bd){bd=d;best={c,cy}}
    }
    if(best){
      const ref=e.clientY<best.cy?best.c:best.c.nextElementSibling;
      if(ref!==it&&it.nextElementSibling!==ref)it.parentNode.insertBefore(it,ref);
    }
    const r0=it.getBoundingClientRect();
    it.style.transform='translate(0px,'+(e.clientY-drag.gy-r0.top)+'px)';
    if(e.clientY<80)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-80)window.scrollBy(0,14);
  });
  const end=e=>{
    if(!drag||e.pointerId!==drag.pid)return;
    const d=drag;drag=null;d.it.classList.remove('dragging');d.it.style.transform='';
    o.done($$(o.item,cont).map(x=>x.dataset.card));
  };
  cont.addEventListener('pointerup',end);cont.addEventListener('pointercancel',end);
}

/* ---------- 背景・ロゴ・アイコン画像の選択 ---------- */
function pickAsset(key){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    if(!/^image\//.test(f.type)){toast('画像ファイルを選んでください');return}
    if(f.size>(key==='bg'?40:8)*1024*1024){toast('画像が大きすぎます');return}
    let src;
    try{src=await readImage(f,key==='bg'?2000:0)}catch{toast('画像を読み込めませんでした');return}
    assets[key]=src;
    try{await DB.putAsset(key,src)}catch{toast('保存に失敗しました（このセッションのみ有効）')}
    if(key==='bg'){settings.bgImage=true;LS.set('mywiki.settings',settings);applyBg()}
    else if(key==='logo')renderLogos();
    else applyFavicon();
    renderSettings();
    toast(key==='bg'?'背景の画像を設定しました':key==='logo'?'ロゴを設定しました':'アイコンを設定しました');
  };
  inp.click();

/* ---------- エクスポート / インポート / 全削除 ---------- */
/* light=true：編集履歴を含めない（ファイルが小さくなる） */
function buildExport(ids,light){
  const lite=a=>light?Object.assign({},a,{versions:[]}):a;
  let data,name,count;
  if(ids){
    const set=new Set(ids),arts=state.articles.filter(a=>set.has(a.id)).map(lite);
    data={app:'YUpedia',version:3,scope:'articles',exportedAt:new Date().toISOString(),articles:arts};
    name='YUpedia-articles-'+dateKey(Date.now())+'.json';count=arts.length;
  }else{
    const as={};Object.entries(assets).forEach(([k,v])=>{if(v)as[k]=v});
    data={app:'YUpedia',version:3,exportedAt:new Date().toISOString(),articles:state.articles.map(lite),bookmarks:bms,history:hist,opened,settings,assets:as};
    name='YUpedia-'+dateKey(Date.now())+'.json';count=state.articles.length;
  }
  const json=JSON.stringify(data);
  return {json,blob:new Blob([json],{type:'application/json'}),name,count};
}
async function gzipText(t){
  const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();
  w.write(new TextEncoder().encode(t));w.close();
  return await new Response(cs.readable).blob();
}
async function readImportText(file){
  const buf=new Uint8Array(await file.arrayBuffer());
  if(buf[0]===0x1f&&buf[1]===0x8b){   // 圧縮されたファイル
    if(!window.DecompressionStream)throw new Error('gz');
    const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();
    w.write(buf);w.close();
    return await new Response(ds.readable).text();
  }
  return new TextDecoder().decode(buf);
}
/* 共有：端末の「共有メニュー」からそのまま送る（共有できないときはダウンロードしない）

let shareCands=null,xferLight=true;
function buildShareCands(ids,light){
  const {blob,name}=buildExport(ids,light);
  const base=name.replace(/\.json$/,'');
  return [new File([blob],name,{type:'application/json'}),new File([blob],name,{type:'text/plain'}),new File([blob],base+'.txt',{type:'text/plain'})];
}

}
function copyData(ids,light){

/* 共有画面が開けなかったとき：理由を表示し、代わりにデータをコピーして送れるようにする（ダウンロードはしない） */

function shareData(ids,light){

async function exportData(ids,light){

}
/* 送り方の選択（共有・コピー・エクスポート・直接送信で共通） */
const XFER_WORD={share:'共有',export:'エクスポート',copy:'コピー',p2p:'直接送信'};
function doXfer(kind,ids){
  const light=xferLight;
  if(kind==='share')shareData(ids,light);

function showPicker(box,kind,close,word){
  const list=sortedArticles(),sel=new Set();

  box.innerHTML=`<button type="button" class="modal-x icon-btn" aria-label="閉じる">${ic('x')}</button><h3>記事を${word}</h3>${
    list.length?`<div class="row" style="margin-bottom:8px"><button type="button" class="btn" data-r="toggle">全選択</button></div><div class="sel-list">${list.map(a=>`<label class="sel-row"><input type="checkbox" class="chk blue" data-id="${a.id}"><span>${esc(a.title)}</span></label>`).join('')}</div><div class="row end" style="margin-top:12px"><button type="button" class="btn primary" data-r="go" disabled>0件を${word}</button></div>`
    :'<p>記事がありません</p>'}`;
  $('.modal-x',box).addEventListener('click',close);
  const upd=()=>{const g=$('[data-r="go"]',box);if(g){g.disabled=!sel.size;g.textContent=sel.size+'件を'+word}};
  box.onchange=e=>{const c=e.target.closest('input[data-id]');if(!c)return;if(c.checked)sel.add(c.dataset.id);else sel.delete(c.dataset.id);upd()};
  box.onclick=e=>{
    const b=e.target.closest('[data-r]');if(!b)return;
    if(b.dataset.r==='toggle'){
      const all=sel.size===list.length;
      $$('input[data-id]',box).forEach(c=>{c.checked=!all;if(!all)sel.add(c.dataset.id);else sel.delete(c.dataset.id)});
      upd();
    }else if(b.dataset.r==='go'){
      if(!sel.size)return;
      const ids=[...sel];close();doXfer(kind,ids);
    }
  };
}
