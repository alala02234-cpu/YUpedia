  if(!document.body.contains(r.startContainer))return null;
  return r;
}
const richOf=r=>(r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement).closest('.rich,.cap-rich');

/* ---- URL挿入 ---- */
function normUrl(s){
  s=(s||'').trim();if(!s)return null;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(s))s='https://'+s;
  try{const u=new URL(s);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}
}
function openUrlModal(){
  if(!getRange()){toast('先に、リンクを入れたい本文（または説明文）中の位置をクリックしてください');return}
  syncFromDOM();
  const heads=[...new Set(ed.a.sections.map(x=>(x.heading||'').trim()).filter(Boolean))];
  const box=document.createElement('div');box.className='modal-box square';
  box.innerHTML=`<button class="modal-x icon-btn" aria-label="閉じる">${ic('x')}</button><div><input id="uWiki" class="m-input" placeholder="YUpedia内を検索" autocomplete="off"><div id="uRes" class="u-res"></div><div class="lbl">この記事の目次</div><div id="uToc" class="u-res">${heads.length?heads.map(h=>`<button class="u-item" data-toc="${esc(h)}">${esc(h)}</button>`).join(''):'<div class="u-none">目次がまだありません</div>'}</div></div><div class="row"><input id="uUrl" class="m-input" placeholder="URLを入力" autocomplete="off"><button class="btn primary" id="uGo">挿入</button></div>`;
  const close=openModal(box);
  const res=$('#uRes',box),q=$('#uWiki',box);
  const draw=()=>{
    const k=q.value.trim().toLowerCase();
    const list=sortedArticles().filter(a=>a.id!==ed.a.id&&(!k||a.title.toLowerCase().includes(k))).slice(0,6);

  };

function insertLink(href,label,wikiId,tocTitle){
  const r=getRange();if(!r){toast('挿入位置が見つかりません');return}
  const rich=richOf(r);if(!rich){toast('挿入位置が見つかりません');return}
  rich.focus();
  const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  const a=document.createElement('a');a.href=href;
  if(tocTitle){a.dataset.toc=tocTitle;a.textContent=(!r.collapsed&&r.toString())||label}
  else if(wikiId){a.dataset.wiki=wikiId;a.dataset.hist=label;a.textContent=label}
  else{a.target='_blank';a.rel='noopener noreferrer';a.textContent=(!r.collapsed&&r.toString())||label}
  r.deleteContents();r.insertNode(a);
  const sp=document.createTextNode('\u00A0');a.after(sp);
  const nr=document.createRange();nr.setStart(sp,1);nr.collapse(true);
  sel.removeAllRanges();sel.addRange(nr);ed.lastRange=nr.cloneRange();
  commit();
}

/* ---- [[記事名]] / [[記事名§目次名]] → 記事（の目次）へのリンク ／ {{目次名}} → この記事内の目次へのリンク ----
   閉じ括弧まで入力すると、自動でリンクに変わります（全角の［］｛｝でも可） */
function makeWikiLinkEl(title,sec){
  const a=document.createElement('a');a.dataset.wt=title;a.textContent=title;
  if(sec)a.dataset.ws=sec;
  refreshWikiLink(a);
  return a;
}
function makeTocLinkEl(title){
  const a=document.createElement('a');a.dataset.toc=title;a.textContent=title;a.href='#';
  return a;
}
const LINK_RE=/[\[［]{2}([^\[\]［］]+?)[\]］]{2}|[{｛]{2}([^{}｛｝]+?)[}｝]{2}/;
function autoLink(rich){
  if(!ed||!rich)return;
  let changed=false;
  for(let guard=0;guard<30;guard++){
    const w=document.createTreeWalker(rich,NodeFilter.SHOW_TEXT,{acceptNode:n=>(n.parentElement&&n.parentElement.closest('a'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
    let node,tn=null,m=null;
    while((node=w.nextNode())){const mm=LINK_RE.exec(node.nodeValue);if(mm){tn=node;m=mm;break}}
    if(!tn)break;
    const raw=(m[1]!==undefined?m[1]:m[2]).replace(/\s+/g,' ').trim();
    let title=raw,sec='';
    if(m[1]!==undefined){const k=raw.indexOf('§');if(k>=0){title=raw.slice(0,k).trim();sec=raw.slice(k+1).trim()}}
    if(!title)break;
    const sel=getSelection();
    const hadCaret=sel.rangeCount&&sel.anchorNode===tn;
    const r=document.createRange();r.setStart(tn,m.index);r.setEnd(tn,m.index+m[0].length);
    r.deleteContents();
    const a=m[1]!==undefined?makeWikiLinkEl(title,sec):makeTocLinkEl(title);
    r.insertNode(a);
    let nxt=a.nextSibling;
    if(nxt&&nxt.nodeType===3&&nxt.nodeValue===''){nxt.remove();nxt=a.nextSibling}
    const nr=document.createRange();
    if(nxt&&nxt.nodeType===3){nr.setStart(nxt,0)}
    else{const sp=document.createTextNode('\u00A0');a.after(sp);nr.setStart(sp,1)}
    nr.collapse(true);
    if(hadCaret){sel.removeAllRanges();sel.addRange(nr);ed.lastRange=nr.cloneRange()}
    changed=true;
  }
  if(changed)commit();
}
$('#view').addEventListener('input',e=>{
  if(!ed||e.isComposing)return;
  const rich=e.target.closest&&e.target.closest('.rich,.cap-rich');
  if(rich)autoLink(rich);
});
$('#view').addEventListener('compositionend',e=>{
  if(!ed)return;
  const rich=e.target.closest&&e.target.closest('.rich,.cap-rich');
  if(rich)setTimeout(()=>{if(ed&&document.body.contains(rich))autoLink(rich)},0);
});

function normHex(v){

function applySize(px){

/* ---- 検索と置き換え（Ctrl+H） ---- */
const findRoots=()=>$$('#editor .rich,#editor .cap-rich');
function textNodesOf(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(n.parentElement&&n.parentElement.closest('a'))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const out=[];let n;while((n=w.nextNode()))out.push(n);return out;
}
function findMatches(q){
  const ql=q.toLowerCase(),out=[];
  for(const root of findRoots())for(const n of textNodesOf(root)){
    const t=n.nodeValue.toLowerCase();let i=0;
    while((i=t.indexOf(ql,i))>=0){out.push({n,s:i});i+=ql.length}
  }
  return out;
}
const headFields=()=>[$('#titleInput'),...$$('#editor .sec-heading')].filter(Boolean);
function headCount(q){
  const ql=q.toLowerCase();let c=0;
  headFields().forEach(f=>{const t=f.value.toLowerCase();let i=0;while((i=t.indexOf(ql,i))>=0){c++;i+=ql.length}});
  return c;
}
function findInfo(t){const el=$('#fInfo');if(el)el.textContent=t}
function markFind(ms,cur,q){
  clearFindMarks();
  try{
    if(window.Highlight&&window.CSS&&CSS.highlights){
      const mk=m=>{const r=document.createRange();r.setStart(m.n,m.s);r.setEnd(m.n,m.s+q.length);return r};
      if(ms.length)CSS.highlights.set('find-all',new Highlight(...ms.map(mk)));
      if(cur)CSS.highlights.set('find-cur',new Highlight(mk(cur)));
      return true;
    }
  }catch{}
  return false;
}
function findRefresh(){
  const q=($('#fFind')||{}).value||'';
  if(!ed)return;
  ed.fr=null;ed.fpos=null;
  if(!q){clearFindMarks();findInfo('');return}
  const ms=findMatches(q),hc=headCount(q);
  markFind(ms,null,q);
  findInfo(`本文など ${ms.length}件`+(hc?`、見出し・目次名 ${hc}件`:''));
}
function findNext(){
  if(!ed)return;
  const q=$('#fFind').value;if(!q){findInfo('検索する単語を入力してください');return}
  const ms=findMatches(q),hc=headCount(q);
  if(!ms.length){ed.fr=null;ed.fpos=null;clearFindMarks();findInfo(hc?`本文には見つかりません（見出し・目次名に${hc}件）`:'見つかりません');return}
  let pick=null;
  if(ed.fpos&&document.body.contains(ed.fpos.startContainer)){
    for(const m of ms){const r=document.createRange();r.setStart(m.n,m.s);if(r.compareBoundaryPoints(Range.START_TO_START,ed.fpos)>=0){pick=m;break}}
  }
  if(!pick)pick=ms[0];
  const r=document.createRange();r.setStart(pick.n,pick.s);r.setEnd(pick.n,pick.s+q.length);
  ed.fr=r.cloneRange();
  const np=document.createRange();np.setStart(pick.n,pick.s+q.length);np.collapse(true);ed.fpos=np;
  if(!markFind(ms,pick,q)){const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}
  const el=pick.n.parentElement;if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});
  findInfo(`${ms.length}件中 ${ms.indexOf(pick)+1}件目`+(hc?`（ほかに見出し・目次名 ${hc}件）`:''));
}
function findReplaceOne(){
  if(!ed)return;
  const q=$('#fFind').value;if(!q)return;
  const rep=$('#fRep').value,r=ed.fr;
  if(r&&document.body.contains(r.startContainer)&&r.toString().toLowerCase()===q.toLowerCase()){
    r.deleteContents();
    const tn=document.createTextNode(rep);r.insertNode(tn);
    const np=document.createRange();np.setStartAfter(tn);np.collapse(true);ed.fpos=np;ed.fr=null;
    commit();
  }
  findNext();
}
function findReplaceAll(){
  if(!ed)return;
  const q=$('#fFind').value;if(!q){findInfo('検索する単語を入力してください');return}
  const rep=$('#fRep').value;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  const ql=q.toLowerCase();
  let n=0;
  for(const root of findRoots())for(const t of textNodesOf(root)){
    if(t.nodeValue.toLowerCase().includes(ql))t.nodeValue=t.nodeValue.replace(re,()=>{n++;return rep});
  }
  headFields().forEach(f=>{if(f.value.toLowerCase().includes(ql))f.value=f.value.replace(re,()=>{n++;return rep})});
  ed.fr=null;ed.fpos=null;
  commit();findRefresh();
  findInfo(n?`${n}件を置き換えました`:'見つかりません');
}
function openFind(){
  if(!ed||ed.preview)return;
  let p=$('#findPanel');
  if(p){const i=$('#fFind',p);i.focus();i.select();return}
  p=document.createElement('div');p.id='findPanel';p.className='float-panel';
  p.innerHTML=`<button type="button" class="modal-x icon-btn" data-f="close" aria-label="閉じる">${ic('x')}</button><div class="set-t" style="margin:0 0 10px">検索と置き換え</div><input id="fFind" class="m-input" placeholder="検索する単語" autocomplete="off"><input id="fRep" class="m-input" placeholder="置き換える単語" autocomplete="off" style="margin-top:6px"><div class="row" style="margin-top:8px"><button type="button" class="btn" data-f="next">次を検索</button><button type="button" class="btn" data-f="rep">置換</button><button type="button" class="btn" data-f="all">すべて置換</button></div><div id="fInfo" class="hint" style="margin:8px 0 0"></div>`;
  document.body.appendChild(p);
  const fi=$('#fFind',p);
  const lr=getRange();
  if(lr&&!lr.collapsed){const t=lr.toString();if(t&&t.length<=100&&!/\n/.test(t))fi.value=t}
  fi.addEventListener('input',findRefresh);

  $('#fRep',p).addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();findReplaceOne()}});
  p.addEventListener('click',e=>{
    const b=e.target.closest('[data-f]');if(!b)return;
    switch(b.dataset.f){
      case 'close':closePanel(p);break;
      case 'next':findNext();break;
      case 'rep':findReplaceOne();break;
      case 'all':findReplaceAll();break;
    }
  });
  fi.focus();fi.select();
  if(fi.value)findRefresh();
}

    case 'del-exec':
      if(el.dataset.k==='hist'){
        if(!histSel.size)break;
        hist=hist.filter(h=>!histSel.has(h.i));LS.set('mywiki.history',hist);
        histDel=false;histSel.clear();renderHistory();
      }else{
        if(!bmSel.size)break;
        bms=bms.filter(b=>!bmSel.has(b.id));saveBM();
        bmDel=false;bmSel.clear();renderBookmarks();
      }
      toast('削除しました');break;
    /* ブックマークの並べ替え */
    case 'sort-toggle':bmSortOpen=!bmSortOpen;renderBookmarks();break;
    case 'sort':settings.bmSort=el.dataset.v;LS.set('mywiki.settings',settings);renderBookmarks();break;
    /* エディタ */
    case 'save':saveEditor();break;
    case 'draft':saveDraft();break;
    case 'cancel':cancelEditor();break;
    case 'add-sec':addSectionAt(+el.dataset.pos);break;
    case 'sec-del':handleSecDel(el);break;
    case 'slot':placeMedia(+el.dataset.sec,+el.dataset.pos);break;
    case 'm-del':{
      if(!ed)break;
      const med=el.closest('.media'),mid=med.dataset.mid,sec=el.closest('.section'),i=+sec.dataset.i;
      commit();const s=ed.a.sections[i];s.media=s.media.filter(m=>m.mid!==mid);
      med.remove();drawSlots();commit();break}
  }
});
/* チェックボックス・プルダウン */
view.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const y=window.scrollY;
  switch(el.dataset.act){
    case 'rm-item':el.checked?histSel.add(el.dataset.i):histSel.delete(el.dataset.i);renderHistory();break;
    case 'rm-date':{
      const g=historyGroups().find(g=>g.d===el.dataset.d);
      if(g)g.items.forEach(it=>el.checked?histSel.add(it.i):histSel.delete(it.i));
      renderHistory();break}
    case 'bm-item':el.checked?bmSel.add(el.dataset.i):bmSel.delete(el.dataset.i);renderBookmarks();break;
    case 'home-logo':settings.homeLogo=el.checked;LS.set('mywiki.settings',settings);toast('設定を保存しました');return;
    case 'home-hist':settings.homeHist=el.checked;LS.set('mywiki.settings',settings);toast('設定を保存しました');return;
    case 'home-bm':settings.homeBm=el.checked;LS.set('mywiki.settings',settings);toast('設定を保存しました');return;
    case 'home-sort':{
      settings.bmSort=el.value;LS.set('mywiki.settings',settings);
      const aside=$('.home-side.right');if(aside)aside.outerHTML=homeSideHTML('bm');
      return}
    default:return;
  }
  window.scrollTo(0,y);
});
/* 画像・映像・音声のドラッグによる並び替え・セクション間の移動 */
let dragMedia=null;
view.addEventListener('dragstart',e=>{
  if(!ed)return;
  const med=e.target.closest('#editor .media');if(!med)return;
  const sec=med.closest('.section');if(!sec)return;
  dragMedia={si:+sec.dataset.i,mid:med.dataset.mid};
  if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain','')}catch{}}
  med.classList.add('dragging');
});
view.addEventListener('dragend',()=>{
  $$('.media.dragging').forEach(x=>x.classList.remove('dragging'));
  $$('.sec-right.drag-over').forEach(x=>x.classList.remove('drag-over'));
  dragMedia=null;
});
view.addEventListener('dragover',e=>{
  if(!ed||!dragMedia)return;
  const right=e.target.closest('#editor .sec-right');
  if(!right)return;
  e.preventDefault();
  $$('.sec-right.drag-over').forEach(x=>{if(x!==right)x.classList.remove('drag-over')});
  right.classList.add('drag-over');
});
view.addEventListener('drop',e=>{
  if(!ed||!dragMedia)return;
  const right=e.target.closest('#editor .sec-right');if(!right)return;
  e.preventDefault();
  right.classList.remove('drag-over');
  const sec=right.closest('.section');if(!sec)return;
  const targetSi=+sec.dataset.i;
  const med=e.target.closest('.media');
  let targetMid=null,before=true;
  if(med){
    targetMid=med.dataset.mid;
    const r=med.getBoundingClientRect();
    before=(e.clientY-r.top)<r.height/2;
  }
  const dm=dragMedia;dragMedia=null;
  if(dm.si===targetSi&&dm.mid===targetMid)return;
  moveMedia(dm.si,dm.mid,targetSi,targetMid,before);
});
view.addEventListener('input',e=>{if(ed&&e.target.closest('.rich,.cap-rich,.sec-heading,#titleInput'))commitSoon()});
view.addEventListener('paste',e=>{
  if(!ed||!e.target.closest('.rich,.cap-rich'))return;
  e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText',false,t);
});
view.addEventListener('drop',e=>{
  if(!(e.target.closest&&e.target.closest('.rich,.cap-rich')))return;
  const dt=e.dataTransfer;
  if(dt&&dt.files&&dt.files.length){e.preventDefault();return} // 外部からのファイルのドロップは無視（画像・映像・音声は専用ボタンから追加）
  // それ以外（本文中のURLや文字の移動）は、ブラウザの既定の動作にまかせる
});
/* 説明文でEnterを押したら改行（<br>）にする */
view.addEventListener('keydown',e=>{
  if(!ed||e.key!=='Enter'||e.isComposing||e.keyCode===229)return;
  if(e.target.closest&&e.target.closest('.cap-rich')){e.preventDefault();document.execCommand('insertLineBreak')}
});

  <button class="tb" data-act="tb-url">${ic('link',18)}URL</button>

  <button class="tb" data-act="tb-video">${ic('video',18)}映像</button>
  <button class="tb" data-act="tb-audio">${ic('mic',18)}音声</button>
  <button class="tb" data-act="tb-text" title="色・太字・斜体・下線・大きさ">${ic('type',18)}文字変更</button>

$('#subbar').addEventListener('mousedown',e=>e.preventDefault());   // 本文の選択位置を保持
$('#subbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||!ed)return;
  switch(b.dataset.act){
    case 'tb-url':openUrlModal();break;
    case 'tb-image':pickFile('image');break;

/* キーボード：Ctrl+Z / Ctrl+Y / Ctrl+S（保存） / Ctrl+Shift+S（一時保存） / Ctrl+H（検索と置き換え） */
document.addEventListener('keydown',e=>{
  if(!ed)return;
  if(ed.preview)return;
  const mod=e.ctrlKey||e.metaKey;if(!mod)return;
  if(e.target.closest&&(e.target.closest('#header')||e.target.closest('.modal-back')))return;
  const k=e.key.toLowerCase();
  if(k==='h'){e.preventDefault();openFind();return}
  if(e.target.closest&&e.target.closest('.float-panel'))return;
  if(k==='z'&&!e.shiftKey){e.preventDefault();undo()}
  else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo()}
  else if(k==='s'){e.preventDefault();if(e.shiftKey)saveDraft();else saveEditor()}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const pn=e.target.closest&&e.target.closest('.float-panel');
  if(pn)closePanel(pn);
});
document.addEventListener('beforeinput',e=>{
  if(ed&&(e.inputType==='historyUndo'||e.inputType==='historyRedo')&&!(e.target.closest&&e.target.closest('#header')))e.preventDefault();
});

/* ================= ページバー ================= */
const BAR_DEFS={home:{n:'ホーム'},back:{n:'戻る'},fwd:{n:'進む'},search:{n:'検索'},tabs:{n:'タブ'},new:{n:'ページ作成'},bookmarks:{n:'ブックマーク'},history:{n:'履歴'},settings:{n:'設定'},guide:{n:'使い方'},space:{n:'空白'}};
const BAR_DEFAULT=['home','back','fwd','search','tabs','new','bookmarks','history','settings'];
const BAR_ICON={home:'home',back:'left',fwd:'right',search:'search',new:'plus',bookmarks:'star',history:'clock',settings:'gear',guide:'help'};
const BAR_HREF={new:'#/new',bookmarks:'#/bookmarks',history:'#/history',settings:'#/settings',guide:'#/guide'};
const isVertical=()=>{const p=currentPos();return p==='left'||p==='right'};
function currentPos(){return ['top','bottom','left','right'].includes(settings.barPos)?settings.barPos:'top'}
function getBarItems(){
  const l=Array.isArray(settings.barItems)?settings.barItems.filter((x,i,a)=>BAR_DEFS[x]&&(x==='space'||a.indexOf(x)===i)):BAR_DEFAULT.slice();
  if(!l.includes('settings'))l.push('settings');
  return l;
}
function barItemHTML(id){
  const n=BAR_DEFS[id].n;
  switch(id){
    case 'home':return `<a class="logo bar-it" id="hdrLogo" href="#/" title="ホーム"></a>`;
    case 'back':return `<button type="button" class="icon-btn bar-it" id="backBtn" title="1つ前のページに戻る" aria-label="戻る">${ic('left')}<span class="bl">戻る</span></button>`;
    case 'fwd':return `<button type="button" class="icon-btn bar-it" id="fwdBtn" title="次のページに進む" aria-label="進む">${ic('right')}<span class="bl">進む</span></button>`;
    case 'space':return `<span class="bar-it bar-gap" aria-hidden="true"></span>`;
    case 'search':return `<div class="bar-it bar-search" id="barSearchSlot"></div>`;
    case 'tabs':return `<a class="tab-link bar-it" href="#/tabs" title="タブ" aria-label="タブ"><span class="tab-btn" id="tabBtn">0</span><span class="bl">タブ</span></a>`;
    default:return `<a class="icon-btn bar-it" href="${BAR_HREF[id]}" title="${n}" aria-label="${n}">${ic(BAR_ICON[id])}<span class="bl">${n}</span></a>`;
  }
}
function measureBar(){
  const h=$('#header');if(!h||!h.classList.contains('bar-h'))return;
  document.documentElement.style.setProperty('--hh',h.offsetHeight+'px');
}
function renderBar(){
  const h=$('#header');
  h.innerHTML=getBarItems().map(barItemHTML).join('');
  const slot=$('#barSearchSlot',h);if(slot&&hdrSearch)slot.appendChild(hdrSearch.el);
  renderLogos();updateNav();updateTabBtn();measureBar();
}
let scrollHidden=false,arrowOpen=false;
function applyBar(){
  const arrow=settings.barMode==='arrow',pos=currentPos();
  const hide=arrow?!arrowOpen:(settings.barMode==='always'?false:scrollHidden);
  $('#header').classList.toggle('hide',hide);
  document.body.classList.toggle('hdr-hidden',hide);
  document.body.classList.toggle('bar-opened',arrow&&arrowOpen);
  const t=$('#barToggle');t.hidden=!arrow;
  if(arrow){
    const closed={top:0,bottom:180,left:-90,right:90},open={top:180,bottom:0,left:90,right:-90};
    const sv=t.firstElementChild;if(sv)sv.style.transform='rotate('+(arrowOpen?open:closed)[pos]+'deg)';
    t.title=arrowOpen?'ページバーを閉じる':'ページバーを開く';
  }
}
function applyBarSettings(){
  const pos=currentPos(),b=document.body;
  ['top','bottom','left','right'].forEach(p=>b.classList.toggle('bar-'+p,p===pos));
  const arrow=settings.barMode==='arrow';
  b.classList.toggle('bar-arrow',arrow);b.classList.toggle('bar-default',!arrow);
  $('#header').className=isVertical()?'bar-v':'bar-h';
  renderBar();applyBar();
}
const saveBarItems=l=>{settings.barItems=l;LS.set('mywiki.settings',settings);renderBar()};

/* ---- 設定：ページバーの並び順（ドラッグで入れ替え／クリックで×） ---- */
function mockInner(id){
  const n=BAR_DEFS[id].n;
  if(id==='space')return `<span class="mi-space">空白</span>`;
  if(id==='home')return logoHTML('');
  if(id==='search')return `<span class="mi-search">${ic('search',16)}<span>YUpediaを検索</span></span>`;
  if(id==='tabs')return `<span class="tab-btn">${tabs.length>99?'99+':tabs.length}</span><span class="bl">${n}</span>`;
  return `${ic(BAR_ICON[id])}<span class="bl">${n}</span>`;
}
function mockItem(id){
  return `<div class="mi" data-id="${id}" title="${BAR_DEFS[id].n}">${mockInner(id)}${id==='settings'?'':`<button type="button" class="mi-x" data-act="bar-x" title="このボタンを消す">${ic('x',12)}</button>`}</div>`;
}
function addMenuHTML(){
  const cur=getBarItems();
  return Object.keys(BAR_DEFS).filter(k=>k==='space'||!cur.includes(k)).map(k=>{
    const icon=k==='space'?'<span class="mi-space">空白</span>':k==='tabs'?'<span class="tab-btn" style="width:22px;height:22px;border-width:2px;font-size:12px">'+tabs.length+'</span>':ic(k==='home'?'home':BAR_ICON[k],18);
    return `<button type="button" data-act="bar-add" data-id="${k}" title="${k==='space'?'ボタンの間隔を空けます':BAR_DEFS[k].n+'を追加'}">${icon}${k==='space'?'':BAR_DEFS[k].n}</button>`;
  }).join('');
}
function mockHTML(){
  return `<div class="mock-wrap"><div class="mock-bar ${isVertical()?'v':'h'}" id="mockBar">${getBarItems().map(mockItem).join('')}</div></div><div class="lbl" style="margin-top:16px">追加できるボタン（押すと最後に追加されます）</div><div id="mockMenu" class="mock-menu">${addMenuHTML()}</div>`;
}
function initMock(){
  const bar=$('#mockBar');if(!bar)return;
  let drag=null;
  bar.addEventListener('pointerdown',e=>{
    if(e.target.closest('.mi-x'))return;
    const it=e.target.closest('.mi');if(!it)return;
    const r=it.getBoundingClientRect();
    drag={it,sx:e.clientX,sy:e.clientY,gx:e.clientX-r.left,gy:e.clientY-r.top,on:false,pid:e.pointerId};
  });
  bar.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.pid)return;
    if(!drag.on){
      if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;
      drag.on=true;drag.it.classList.add('dragging');
      $$('.mi.sel',bar).forEach(x=>x.classList.remove('sel'));
      try{bar.setPointerCapture(e.pointerId)}catch{}
    }
    e.preventDefault();
    const it=drag.it;it.style.transform='none';
    let best=null,bd=Infinity;
    for(const c of [...bar.children]){
      if(c===it||!c.classList.contains('mi'))continue;
      const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
      const d=(e.clientX-cx)**2+(e.clientY-cy)**2;
      if(d<bd){bd=d;best={c,cx,cy}}
    }
    if(best){
      const before=bar.classList.contains('v')?e.clientY<best.cy:e.clientX<best.cx;
      const ref=before?best.c:best.c.nextElementSibling;
      if(ref!==it&&it.nextElementSibling!==ref)bar.insertBefore(it,ref);
    }
    const r0=it.getBoundingClientRect();
    it.style.transform=`translate(${e.clientX-drag.gx-r0.left}px,${e.clientY-drag.gy-r0.top}px)`;
  });
  const end=e=>{
    if(!drag||e.pointerId!==drag.pid)return;
    const d=drag;drag=null;
    if(d.on){
      d.it.classList.remove('dragging');d.it.style.transform='';
      saveBarItems($$('.mi',bar).map(x=>x.dataset.id));
    }else{
      const was=d.it.classList.contains('sel');
      $$('.mi.sel',bar).forEach(x=>x.classList.remove('sel'));
      if(!was)d.it.classList.add('sel');
    }
  };
  bar.addEventListener('pointerup',end);
  bar.addEventListener('pointercancel',end);
}

/* ヘッダーのスクロール表示切り替え／上部へ戻るボタン */
let lastY=0;
const hasOpenDD=()=>$$('.s-dd').some(d=>!d.hidden);
function hideHeader(){scrollHidden=true;applyBar()}
function showHeader(){scrollHidden=false;applyBar()}
window.addEventListener('scroll',()=>{
  const y=window.scrollY;
  const tb=$('#toTopBtn');if(tb)tb.hidden=!(y>400);
  const bmode=settings.barMode;
  if(bmode==='arrow'){lastY=y;return}
  if(bmode==='always')return;
  if(bmode==='attop'){const hid=y>20;if(hid!==scrollHidden){scrollHidden=hid;applyBar()}return}
  if(Math.abs(y-lastY)<6)return;
  if(y>lastY&&y>60){if(!hasOpenDD())hideHeader()}else showHeader();
  lastY=y;
},{passive:true});

/* ================= 起動 ================= */
(async function init(){
  applyTheme();applyFont();applyFontFamily();
  $('#header').addEventListener('click',e=>{
    if(e.target.closest('#backBtn')){if(curDepth>0)history.back()}
    else if(e.target.closest('#fwdBtn')){if(curDepth<maxDepth)history.forward()}
  });
  $('#toTopBtn').innerHTML=ic('up');
  $('#toTopBtn').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
  $('#barToggle').innerHTML=ic('tri',22);
  $('#barToggle').addEventListener('click',()=>{arrowOpen=!arrowOpen;applyBar()});
  const st0=history.state;
  if(st0&&typeof st0.d==='number')curDepth=st0.d;
  else{try{history.replaceState({d:0},'')}catch{}}
  maxDepth=curDepth;
  updateNav();
  hdrSearch=buildSearch(false);
  applyBarSettings();
  if(window.ResizeObserver)new ResizeObserver(measureBar).observe($('#header'));
  try{
    await DB.open();
    state.articles=(await DB.all())||[];
    ((await DB.allAssets())||[]).forEach(r=>{if(r&&r.key in assets)assets[r.key]=r.src});
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch{toast('記事の保存領域を開けませんでした（このセッションのみ有効）')}
  applyBg();renderLogos();applyFavicon();
  route();
})();
</script>
